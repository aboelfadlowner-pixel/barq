<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نجم أبو الفضل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f8; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e6ee;
  --brand:#0f5c4c; --brand2:#13806a; --brand-soft:#e3f3ee;
  --gold:#f2a900; --gold-soft:#fff5d6; --red:#c8372d; --red-soft:#fde8e6;
  --blue:#2f6fd6; --blue-soft:#e6efff; --star-off:#d9dce4;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:19px;font-weight:900;flex:1;min-width:180px}
header h1 small{display:block;font-size:11px;font-weight:600;opacity:.8}
.hdr-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-ctrl input[type=date]{border:0;border-radius:8px;padding:6px 8px}
.role-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:56px;z-index:19}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:700;color:var(--muted)}
nav button.on{background:var(--brand-soft);color:var(--brand)}
main{padding:16px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g-emp{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
h2{font-size:18px;margin:4px 0 12px;font-weight:900}
h3{font-size:15px;margin:0 0 8px;font-weight:800}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:700}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.gold{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
.btn.red{background:var(--red-soft);color:var(--red);border-color:#f3c3be}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.badge{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:800}
.b-gold{background:var(--gold-soft);color:#8a6000}
.b-green{background:var(--brand-soft);color:var(--brand)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:#eef0f4;color:var(--muted)}
/* stars */
.stars{position:relative;display:inline-block;font-size:18px;line-height:1;letter-spacing:1px;direction:ltr}
.stars .bg{color:var(--star-off)}
.stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold)}
.stars.lg{font-size:26px}
/* employee card */
.emp{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s}
.emp:hover{border-color:var(--brand2);box-shadow:0 4px 14px rgba(15,92,76,.08)}
.emp-top{display:flex;gap:10px;align-items:center}
.ava{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.ava.win{box-shadow:0 0 0 3px var(--gold)}
.ava.xl{width:96px;height:96px;font-size:34px}
.emp-name{font-weight:800;line-height:1.3}
.bar{height:8px;background:#eceef3;border-radius:6px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--brand2);border-radius:6px}
.bar>i.warn{background:var(--gold)} .bar>i.bad{background:var(--red)}
.bar .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:3px 0}
.kv b{color:var(--ink)}
/* rating */
.crit{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}
.crit:last-child{border:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:3px 10px;cursor:pointer;font-weight:800;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--brand);color:#fff}
.seg.att button.on[data-v=abs]{background:var(--red)}
.seg.att button.on[data-v=late],.seg.att button.on[data-v=vlate]{background:var(--gold);color:#3a2a00}
.seg.att button.on[data-v=off]{background:#8a90a0}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:800;background:#fafbfc;position:sticky;top:0}
.tbl-wrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.winner-box{background:linear-gradient(135deg,#fff8e0,#fff);border:2px solid var(--gold);border-radius:16px;padding:14px;text-align:center}
.crown{font-size:28px}
.podium{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.podium .card{min-width:180px;text-align:center}
.rank{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.rank.r1{background:var(--gold);color:#3a2a00}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px 10px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:860px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;left:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;z-index:60;display:none;font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{border:1px solid var(--line);border-radius:6px;padding:3px;text-align:center;font-size:11px;min-height:40px}
.cal div.w{background:var(--gold-soft);border-color:var(--gold)}
.lock{font-size:12px;color:var(--muted);background:#fafbfc;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
@media(max-width:640px){main{padding:10px} header{position:static} nav{top:0} header h1{font-size:16px}}
</style>
</head>

let S = null;
const DBN='najm-kpi', ST='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function load(){
  try{const db=await idb();S=await new Promise((res)=>{const t=db.transaction(ST).objectStore(ST).get('state');t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});}catch(e){S=null}
  if(!S) S=defaultState();
  const d=defaultState();
  S.settings=Object.assign(d.settings,S.settings||{});
  for(const k of Object.keys(d)) if(S[k]===undefined) S[k]=d[k];
}

// ---------- scoring ----------
function day(d){return S.days[d]||(S.days[d]={att:{},attTime:{},mgr:{},ops:{},bonus:{},winners:{}});}
function peekDay(d){return S.days[d]||{att:{},attTime:{},mgr:{},ops:{},bonus:{},winners:{}};}
const q25=x=>Math.round(x*4)/4;
function critStars(arr){if(!arr||arr.length<5||arr.some(v=>v==null))return null;return q25(arr.reduce((a,b)=>a+b,0)/10);}
function score(d,code){
  const D=peekDay(d);const st=D.att[code];
  const att = st==null||st==='off'?null:(S.settings.att[st]??0);
  const mgr=critStars(D.mgr[code]), ops=critStars(D.ops[code]);
  const bonus=D.bonus[code]?.v||0;
  const total=Math.min(5,(att||0)+(mgr||0)+(ops||0)+bonus);
  const any = att!=null||mgr!=null||ops!=null||bonus>0;
  return {st,att,mgr,ops,bonus,total:any?total:null,complete:att!=null&&mgr!=null&&ops!=null};
}
function rankGroup(d,list){
  return list.map(e=>({e,s:score(d,e.code)}))
    .filter(x=>x.s.total!=null&&x.s.st!=='abs'&&x.s.st!=='off')
    .sort((a,b)=>b.s.total-a.s.total||(b.s.att||0)-(a.s.att||0)||(b.s.ops||0)-(a.s.ops||0)||(b.s.mgr||0)-(a.s.mgr||0));
}
function winnersOf(d,branch,shift){
  const D=peekDay(d);const k=`${branch}|${shift}`;
  if(D.winners[k]) return D.winners[k];
  return null; // not confirmed
}
function isWinner(d,code){const D=peekDay(d);return Object.values(D.winners||{}).some(a=>a.includes(code));}

// ---------- targets ----------
function salesAgg(month,branch,upto){
  const out={};
  for(const d of monthDays(month,upto)){const b=S.sales[d]?.[branch];if(!b)continue;for(const[k,v]of Object.entries(b)){(out[k]||(out[k]={name:v.name,qty:0})).qty+=v.qty;}}
  return out;
}
const pts=p=>p==null?null:p<50?0:p<85?50:Math.round(p);
function deptProgress(month,branch,dept,upto){
  const cfg=S.targets[month]?.[deptKey(branch,dept)];
  if(!cfg) return null;
  const cap=S.settings.capPct;
  if(cfg.type==='sales'){
    const agg=salesAgg(month,branch,upto);
    const items=(cfg.items||[]).map(it=>{const sold=agg[it.key]?.qty||0;const p=it.target>0?Math.min(cap,sold/it.target*100):null;return {...it,sold,pct:p};});
    const valid=items.filter(i=>i.pct!=null);
    const pct=valid.length?valid.reduce((a,i)=>a+i.pct,0)/valid.length:null;
    return {type:'sales',items,pct,points:pts(pct),pace:upto?(monthDays(month,upto).length/daysInMonth(month)*100):null};
  }
  // manual
  const days=monthDays(month,upto);
  const key=deptKey(branch,dept);
  const kpis=(cfg.kpis||[]).map(k=>{
    const vals=days.map(d=>S.kpiVals[d]?.[key]?.[k.id]).filter(v=>v!=null&&v!=='');
    let pct=null, val=null;
    if(vals.length){
      if(k.kind==='score'){val=vals.reduce((a,b)=>a+ +b,0)/vals.length;pct=k.target>0?Math.min(cap,val/k.target*100):null;}
      else if(k.kind==='count'){val=vals.reduce((a,b)=>a+ +b,0);pct=k.target>0?Math.min(cap,val/k.target*100):null;}
      else {val=vals.reduce((a,b)=>a+ +b,0);const t=+k.target||0;pct=val<=t?100:Math.max(0,100*(1-(val-t)/Math.max(t,1)));}
    }
    return {...k,val,pct,n:vals.length};
  });
  const v=kpis.filter(k=>k.pct!=null);const w=v.reduce((a,k)=>a+(+k.weight||1),0);
  const pct=v.length?v.reduce((a,k)=>a+k.pct*(+k.weight||1),0)/w:null;
  return {type:'manual',kpis,pct,points:pts(pct),pace:null};
}
function complaintsOf(code,month){return S.complaints.filter(c=>c.code===code&&c.date.startsWith(month));}
function empTarget(e,month,upto){
  const dp=deptProgress(month,e.branch,e.dept,upto);
  if(!dp||dp.pct==null) return dp?{...dp,empPoints:null,complaints:complaintsOf(e.code,month).length}:null;
  const cc=complaintsOf(e.code,month).length;
  const empPoints=cc?Math.round(dp.points*(1-S.settings.complaintPenalty/100)):dp.points;
  return {...dp,empPoints,complaints:cc};
}
const money=p=>p==null?null:Math.round(p/100*(+S.settings.bonusAt100||0));

// ---------- month summary ----------
function monthSummary(e,month,upto){
  const days=monthDays(month,upto);let n=0,sum=0,wins=0,abs=0,late=0;
  for(const d of days){const s=score(d,e.code);if(s.st==='abs')abs++;if(s.st==='late'||s.st==='vlate')late++;if(s.total!=null&&s.st!=='abs'){n++;sum+=s.total;}if(isWinner(d,e.code))wins++;}
  const t=empTarget(e,month,upto);
  return {n,avg:n?sum/n:null,wins,abs,late,target:t};
}

// attendance import: «حضور و انصراف يومي» style sheet (كود + حضور/غياب) or a fingerprint export with a time column
function pickFile(accept,cb){const f=$('#filePick');f.value='';f.accept=accept;f.onchange=()=>f.files[0]&&cb(f.files[0]);f.click();}
function readSheet(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array',cellDates:false});const ws=wb.Sheets[wb.SheetNames[0]];res(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));}catch(e){rej(e)}};r.onerror=rej;r.readAsArrayBuffer(file);});}
function findHeader(rows,tests){
  for(let i=0;i<Math.min(rows.length,20);i++){const h=rows[i].map(norm);const idx={};for(const[k,re]of Object.entries(tests)){idx[k]=h.findIndex(c=>re.test(c));}if(Object.values(idx).filter(x=>x>=0).length>=2)return {row:i,idx};}
  return null;
}
const toMin=t=>{const m=String(t).match(/(\d{1,2}):(\d{2})/);if(!m)return null;let h=+m[1];if(/pm|م/i.test(t)&&h<12)h+=12;return h*60+ +m[2];};
function importAttendance(){
  pickFile('.xlsx,.xls,.csv',async f=>{
    let rows;try{rows=await readSheet(f);}catch(e){toast('الملف مش مقروء');return;}
    const H=findHeader(rows,{code:/^(كود|الكود|code|رقم الموظف|id)/,att:/^(atte|حضور|الحاله|الحالة|status)/,time:/(وقت الحضور|الحضور|check ?in|in time|time|الدخول)/});
    if(!H||H.idx.code<0){toast('مش لاقي عمود الكود في الشيت');return;}
    const D=day(DATE);let n=0;
    for(const r of rows.slice(H.row+1)){
      const code=String(r[H.idx.code]||'').trim();const e=emp(code);if(!e)continue;
      const a=H.idx.att>=0?norm(r[H.idx.att]):'';
      const tm=H.idx.time>=0&&H.idx.time!==H.idx.att?String(r[H.idx.time]||'').trim():'';
      let st=null;
      if(tm&&toMin(tm)!=null){
        const start=toMin(S.settings.shiftStart[e.shift]||'09:00');const diff=toMin(tm)-start;
        st=diff<=S.settings.graceMin?'on':diff<=S.settings.lateMax?'late':'vlate';D.attTime[code]=tm;
      } else if(a){ st=/غياب|absent/.test(a)?'abs':/حضور|present/.test(a)?'on':/اجاز|off/.test(a)?'off':null; }
      if(st){D.att[code]=st;n++;}
    }
    save();render();toast(`اتسجل حضور ${n} موظف من الشيت`);
  });
}

  const chosen=new Map((DRAFT.items||[]).map(i=>[i.key,i]));
  const q=norm(DRAFT.q);
  const baseList=Object.entries(base).map(([k,v])=>({key:k,name:v.name,qty:v.qty})).filter(x=>!q||norm(x.name).includes(q)||x.key.includes(q)).sort((a,b)=>b.qty-a.qty).slice(0,300);
  return `<div class="card">${head}
    <div class="lock" style="margin-bottom:8px">الخطوات: 1) ارفع مبيعات الشهر اللي فات (زرار «رفع مبيعات شهر كامل») 2) اختار أصناف القسم 3) التارجت = مبيعات الشهر اللي فات × المُضاعِف (وتقدر تعدّل أي رقم بإيدك).</div>
    <div class="grid g-2">
      <div><h3>أصناف القسم (${fmt(chosen.size)})</h3>
        <div class="tbl-wrap" style="max-height:50vh"><table><thead><tr><th>الصنف</th><th>الشهر اللي فات</th><th>التارجت</th><th></th></tr></thead><tbody>
        ${(DRAFT.items||[]).map((it,i)=>`<tr><td class="small">${esc(it.name)}</td><td class="small">${fmt(base[it.key]?.qty,1)}</td><td><input class="inp" type="number" style="width:90px" value="${it.target}" onchange="DRAFT.items[${i}].target=+this.value"></td><td><button class="btn sm red" onclick="DRAFT.items.splice(${i},1);render()">✕</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty small">اختار أصناف من القايمة</td></tr>'}
        </tbody></table></div></div>
      <div><h3>مبيعات ${monthName(pm)} — ${esc(TG.branch)}</h3>
        <div class="row" style="margin-bottom:6px"><input class="inp" placeholder="بحث عن صنف" value="${esc(DRAFT.q)}" onchange="DRAFT.q=this.value;render()"><label class="small">المُضاعِف × <input class="inp" type="number" step="0.1" style="width:70px" value="${DRAFT.mult}" onchange="DRAFT.mult=+this.value"></label></div>
        ${baseList.length?`<div class="tbl-wrap" style="max-height:50vh"><table><thead><tr><th>الصنف</th><th>الكمية</th><th></th></tr></thead><tbody>
        ${baseList.map(x=>`<tr><td class="small">${esc(x.name)}</td><td>${fmt(x.qty,1)}</td><td>${chosen.has(x.key)?'<span class="badge b-green">مضاف</span>':`<button class="btn sm" onclick="addItem('${esc(x.key)}')">+ إضافة</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty small">مفيش مبيعات للشهر اللي فات — ارفع تقرير شهر كامل الأول</div>'}

function addItem(key){

function importSales(monthly=false){
  pickFile('.xlsx,.xls,.csv',async f=>{
    let rows;try{rows=await readSheet(f);}catch(e){toast('الملف مش مقروء');return;}
    const H=findHeader(rows,{
      code:/^(كود|الكود|كود الصنف|باركود|الباركود|sku|code|item code|barcode)/,
      name:/(اسم الصنف|الصنف|اسم المنتج|المنتج|الاسم|product|item|name)/,
      qty:/(الكميه|كميه|الكمية المباعه|quantity|qty|العدد|الوزن)/,
      branch:/(الفرع|فرع|branch)/
    });

    openModal(salesMapUI(rows,H,f.name,guessBranch,monthly));

let IMP=null;
function salesMapUI(rows,H,fname,branch,monthly){
  IMP={rows,H,fname,branch,monthly,month:prevMonth(monthOf(DATE)),date:DATE};
  const hdr=rows[H.row];
  const sel=(k,label)=>`<label class="small">${label}<br><select class="inp" onchange="IMP.H.idx.${k}=+this.value;previewImp()"><option value="-1">— مش موجود —</option>${hdr.map((h,i)=>`<option value="${i}" ${H.idx[k]===i?'selected':''}>${esc(h)||'عمود '+(i+1)}</option>`).join('')}</select></label>`;
  return `<h2>${monthly?'📊 مبيعات شهر كامل (للتخطيط)':'📥 تقرير المبيعات اليومي'}</h2><div class="small muted" style="margin-bottom:8px">${esc(fname)}</div>
    <div class="row" style="margin-bottom:10px">
      ${monthly?`<label class="small">الشهر<br><input class="inp" type="month" value="${IMP.month}" onchange="IMP.month=this.value"></label>`:`<label class="small">اليوم<br><input class="inp" type="date" value="${IMP.date}" onchange="IMP.date=this.value"></label>`}
      <label class="small">الفرع<br><select class="inp" onchange="IMP.branch=this.value">${branches().map(b=>`<option ${b===branch?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
      ${sel('code','كود الصنف')}${sel('name','اسم الصنف')}${sel('qty','الكمية المباعة')}${sel('branch','عمود الفرع (لو موجود)')}
    </div>
    <div class="lock" style="margin-bottom:8px">بناخد <b>الكمية بس</b> — قيمة المبيعات مش بتدخل في الحساب. لو الملف فيه عمود فرع، كل سطر بيتسجل على فرعه.</div>
    <div id="impPrev"></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" onclick="commitImp()">✔ تأكيد الرفع</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`;
}
function parseImp(){
  const {rows,H}=IMP;const out={};const bi=H.idx.branch;
  for(const r of rows.slice(H.row+1)){
    const code=H.idx.code>=0?String(r[H.idx.code]||'').trim():'';const name=H.idx.name>=0?String(r[H.idx.name]||'').trim():'';
    const qty=parseFloat(String(r[H.idx.qty]??'').replace(/,/g,''));
    if((!code&&!name)||isNaN(qty)||/اجمالي|إجمالي|total/i.test(name)||norm(name)==='محذوف')continue;
    let b=IMP.branch; if(bi>=0&&r[bi]){const m=branches().find(x=>norm(x)===norm(r[bi])||norm(r[bi]).includes(norm(x)));if(m)b=m;}
    const key=code||norm(name);
    const B=out[b]||(out[b]={});(B[key]||(B[key]={name:name||code,qty:0})).qty+=qty;
  }
  return out;
}
function previewImp(){
  const el=$('#impPrev');if(!el)return;
  if(IMP.H.idx.qty<0||(IMP.H.idx.code<0&&IMP.H.idx.name<0)){el.innerHTML='<div class="empty">اختار عمود الكمية وعمود الكود أو الاسم</div>';return;}
  const out=parseImp();
  el.innerHTML=Object.entries(out).map(([b,items])=>{const L=Object.values(items);return `<div class="small"><b>${esc(b)}</b>: ${fmt(L.length)} صنف · إجمالي كميات ${fmt(L.reduce((a,x)=>a+x.qty,0),1)}</div>`;}).join('')+
   `<div class="tbl-wrap" style="max-height:35vh;margin-top:6px"><table><thead><tr><th>الصنف</th><th>الكمية</th></tr></thead><tbody>${Object.values(out).flatMap(o=>Object.values(o)).slice(0,40).map(x=>`<tr><td class="small">${esc(x.name)}</td><td>${fmt(x.qty,2)}</td></tr>`).join('')}</tbody></table></div>`;
}
function commitImp(){
  const out=parseImp();if(!Object.keys(out).length){toast('مفيش بيانات اتقرت');return;}
  if(IMP.monthly){const M=S.baseSales[IMP.month]||(S.baseSales[IMP.month]={});Object.assign(M,out);}
  else{const D=S.sales[IMP.date]||(S.sales[IMP.date]={});for(const[b,v]of Object.entries(out)){if(D[b]&&!confirm(`فيه تقرير مرفوع لـ ${b} يوم ${IMP.date}. استبداله؟`))continue;D[b]=v;}}
  save();closeModal();render();toast('✔ اتسجل تقرير المبيعات');
}

  }

  const comps=S.complaints.filter(c=>c.code===code).sort((a,b)=>b.date.localeCompare(a.date));
  const notes=S.notes.filter(n=>n.code===code).sort((a,b)=>b.date.localeCompare(a.date));

  openModal(`<button class="x" onclick="closeModal()">✕</button>
   <div class="row" style="gap:16px;margin-bottom:14px">
     <div style="position:relative">${ava(e,'xl'+(isWinner(DATE,code)?' win':''))}${can.ops()?`<button class="btn sm" style="position:absolute;bottom:-6px;left:-6px" onclick="setPhoto('${code}')">📷</button>`:''}</div>

       <div class="row" style="margin-top:6px"><span class="badge b-gold">🏆 رجل اليوم ${fmt(allWins)} مرة (إجمالي)</span>${e.active?'':'<span class="badge b-red">غير نشط</span>'}</div></div>
     ${can.ops()?`<button class="btn sm" onclick="editEmp('${code}')">✏️ تعديل</button>`:''}
   </div>
   <div class="grid g-2" style="margin-bottom:12px">
     <div class="card"><h3>${monthName(m)}</h3>
       <div class="kv"><span>متوسط النجوم</span><span>${starsHTML(ms.avg)} <b>${fmt(ms.avg,2)}</b></span></div>
       <div class="kv"><span>أيام متقيّمة</span><b>${fmt(ms.n)}</b></div>

       ${can.ops()&&t?.empPoints!=null&&S.settings.bonusAt100?`<div class="kv"><span>المكافأة (مدير التشغيل فقط)</span><b>${fmt(money(t.empPoints))} ج</b></div>`:''}
     </div>${crit}

   <div class="card" style="margin-bottom:12px"><h3>نجوم الشهر يوم بيوم</h3><div class="cal">${['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(d=>`<div style="border:0;min-height:0" class="muted">${d}</div>`).join('')}${cal}</div></div>

    let rows;try{rows=await readSheet(f);}catch(e){toast('الملف مش مقروء');return;}
    const H=findHeader(rows,{code:/^(كود|الكود)$/,name:/اسم الموظف/,shift:/الشيفت/,branch:/^الفرع/,status:/حاله الموظف|حالة الموظف/,dept:/^القسم/,job:/الوظيف/});
    if(!H||H.idx.code<0||H.idx.name<0){toast('الشيت لازم يكون فيه «كود» و«اسم الموظف»');return;}
    let add=0,upd=0;
    for(const r of rows.slice(H.row+1)){
      const code=String(r[H.idx.code]||'').trim(),name=String(r[H.idx.name]||'').trim();
      if(!code||!name||name==='#N/A')continue;
      const g=k=>H.idx[k]>=0?String(r[H.idx[k]]||'').trim():'';
      const active=H.idx.status>=0?/راس العمل/.test(g('status')):true;
      const sh=g('shift');const br=branches().find(b=>norm(b)===norm(g('branch')))||g('branch');
      let e=emp(code);
      if(e){Object.assign(e,{name,branch:br||e.branch,dept:g('dept')||e.dept,job:g('job')||e.job,shift:Object.values(SH).includes(sh)?sh:e.shift,active});upd++;}
      else if(active){S.employees.push({code,name,branch:br,dept:g('dept'),job:g('job'),shift:Object.values(SH).includes(sh)?sh:'Morning',active,photo:''});add++;}
    }
    save();render();toast(`جديد ${add} · اتحدّث ${upd}`);
  });
}

// ---------- Settings ----------
function vSettings(){
  const s=S.settings;
  const num=(path,label,step=1)=>`<label class="small">${label}<br><input class="inp" type="number" step="${step}" value="${path.split('.').reduce((o,k)=>o[k],s)}" onchange="setS('${path}',+this.value)"></label>`;
  const txt=(path,label,type='text')=>`<label class="small">${label}<br><input class="inp" type="${type}" value="${esc(path.split('.').reduce((o,k)=>o[k],s))}" onchange="setS('${path}',this.value)"></label>`;
  return `<h2>⚙️ الإعدادات</h2>
  <div class="grid g-2">
   <div class="card"><h3>🔐 أرقام الدخول (PIN)</h3><div class="row">${txt('pins.manager','المدير المباشر')}${txt('pins.ops','مدير التشغيل')}</div><div class="small muted" style="margin-top:6px">⚠️ غيّر الأرقام الافتراضية (1234 / 0000) قبل ما توزّع التطبيق.</div></div>
   <div class="card"><h3>⏰ نجوم البصمة</h3><div class="row">${num('att.on','في ميعاده',.25)}${num('att.late','تأخير بسيط',.25)}${num('att.vlate','تأخير كبير',.25)}${num('att.abs','غياب',.25)}</div>
     <div class="row" style="margin-top:8px">${txt('shiftStart.Morning','بداية Morning','time')}${txt('shiftStart.Between','بداية Between','time')}${txt('shiftStart.Night','بداية Night','time')}</div>
     <div class="row" style="margin-top:8px">${num('graceMin','سماح (دقيقة)')}${num('lateMax','تأخير بسيط لحد (دقيقة)')}</div></div>
   <div class="card"><h3>🏆 رجل اليوم</h3><div class="row">${num('finalists','عدد التصفيات')}${num('winnersPerShift','أقصى فايزين في الشيفت')}</div></div>
   <div class="card"><h3>🎯 التارجت</h3><div class="row">${num('defaultMultiplier','المُضاعِف الافتراضي',.1)}${num('capPct','أقصى نسبة %')}${num('complaintPenalty','خصم الشكوى %')}</div></div>
   <div class="card"><h3>💰 المكافأة (مخفية عن الموظفين)</h3><div class="row">${num('bonusAt100','المكافأة عند 100 نقطة (جنيه)')}</div><div class="small muted">المكافأة = النقاط ÷ 100 × المبلغ ده. بتظهر لمدير التشغيل بس.</div></div>
   <div class="card"><h3>💾 البيانات</h3><div class="small muted" style="margin-bottom:8px">البيانات محفوظة على الجهاز ده. خُد نسخة احتياطية بانتظام.</div>
     <div class="row"><button class="btn pri" onclick="exportJSON()">⬇️ نسخة احتياطية</button><button class="btn" onclick="importJSON()">⬆️ استرجاع نسخة</button><button class="btn" onclick="exportXLSX()">📊 تصدير Excel للشهر</button><button class="btn red" onclick="resetAll()">مسح الكل</button></div></div>
  </div>`;
}
function setS(path,v){const ks=path.split('.');let o=S.settings;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v;save();toast('اتحفظ');}
function exportJSON(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`najm-backup-${DATE}.json`;a.click();}
function importJSON(){pickFile('.json',f=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.employees)throw 0;if(!confirm('هيستبدل كل البيانات الحالية. متأكد؟'))return;S=d;load2();}catch(e){toast('ملف غير صالح')}};r.readAsText(f);});}
function load2(){const d=defaultState();S.settings=Object.assign(d.settings,S.settings||{});for(const k of Object.keys(d))if(S[k]===undefined)S[k]=d[k];save();render();toast('اتسترجعت النسخة');}
function resetAll(){if(prompt('اكتب «مسح» للتأكيد')!=='مسح')return;S=defaultState();save();render();}
function exportXLSX(){
  const m=monthOf(DATE);
  const sum=activeEmps().map(e=>{const ms=monthSummary(e,m,DATE);return {'الكود':e.code,'الاسم':e.name,'الفرع':e.branch,'القسم':e.dept,'الوظيفة':e.job,'الشيفت':e.shift,'أيام متقيمة':ms.n,'متوسط النجوم':ms.avg!=null?+ms.avg.toFixed(2):'','رجل اليوم':ms.wins,'غياب':ms.abs,'تأخير':ms.late,'تارجت %':ms.target?.pct!=null?Math.round(ms.target.pct):'','نقاط':ms.target?.empPoints??'','شكاوى':ms.target?.complaints||0,'مكافأة':ms.target?.empPoints!=null?money(ms.target.empPoints):''};});
  const daily=[];for(const d of monthDays(m,DATE))for(const e of activeEmps()){const s=score(d,e.code);if(s.total==null&&!s.st)continue;const D=peekDay(d);daily.push({'التاريخ':d,'الكود':e.code,'الاسم':e.name,'الفرع':e.branch,'البصمة':ATT[s.st]||'','نجوم البصمة':s.att??'','المدير المباشر':s.mgr??'','مدير التشغيل':s.ops??'','سلوك مثالي':s.bonus||'','الإجمالي':s.total??'','رجل اليوم':isWinner(d,e.code)?'✔':'',...Object.fromEntries(CRITERIA.map((c,i)=>['مباشر: '+c,D.mgr[e.code]?.[i]??''])),...Object.fromEntries(CRITERIA.map((c,i)=>['تشغيل: '+c,D.ops[e.code]?.[i]??'']))});}
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sum),'ملخص الشهر');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(daily),'التقييم اليومي');
  XLSX.writeFile(wb,`najm-${m}.xlsx`);
}

// ---------- role switch / modal ----------
function openRole(){
  openModal(`<button class="x" onclick="closeModal()">✕</button><h2>الدخول كـ</h2>
   <div class="row">${Object.entries(ROLE_NAME).map(([k,v])=>`<button class="btn ${ROLE===k?'pri':''}" onclick="setRole('${k}')">${v}</button>`).join('')}</div>
   <div class="small muted" style="margin-top:10px">الموظف بيتابع · المدير المباشر بيقيّم · مدير التشغيل بيقيّم ويحدد التارجت ويعتمد رجل اليوم.</div>`);
}
function setRole(r){
  if(r!=='emp'){const p=prompt('أدخل الرقم السري');if(p===null)return;if(p!==S.settings.pins[r]){toast('رقم غلط');return;}}
  ROLE=r;RATE_AS=r==='ops'?'ops':'mgr';try{sessionStorage.setItem('najm-role',r)}catch(e){}closeModal();render();
}
function openModal(h){$('#modal').innerHTML=h;$('#modalBg').classList.add('open');if(IMP&&$('#impPrev'))previewImp();}
function closeModal(){$('#modalBg').classList.remove('open');IMP=null;}

// ---------- boot ----------
(async()=>{
  await load();
  try{const r=sessionStorage.getItem('najm-role');if(r&&ROLE_NAME[r]){ROLE=r;RATE_AS=r==='ops'?'ops':'mgr';}}catch(e){}
  const dp=$('#dayPick');dp.value=DATE;dp.onchange=()=>{if(dp.value){DATE=dp.value;render();}};
  render();
})();
</script>
