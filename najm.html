<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نجم أبو الفضل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#1b2231; --muted:#6b7385; --line:#e3e6ee;
  --brand:#0f5c4c; --brand2:#13806a; --brand-soft:#e3f3ee;
  --gold:#f2a900; --gold-soft:#fff5d6; --red:#d23a2e; --red-soft:#fde8e6;
  --yellow:#f6c700; --green:#1f9d55; --green-soft:#e2f6ea;
  --blue:#2f6fd6; --blue-soft:#e6efff; --star-off:#d9dce4; --purple:#5b3fd1; --purple-soft:#ece8ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
header{background:linear-gradient(120deg,#0b4a3d,#13806a);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:19px;font-weight:900;flex:1;min-width:180px}
header h1 small{display:block;font-size:11px;font-weight:600;opacity:.8}
.hdr-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-ctrl input[type=date]{border:0;border-radius:8px;padding:6px 8px}
.role-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:56px;z-index:19}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:700;color:var(--muted)}
nav button.on{background:var(--brand-soft);color:var(--brand)}
nav .cnt{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-inline-start:4px}
main{padding:16px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g-emp{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
h2{font-size:18px;margin:4px 0 12px;font-weight:900}
h3{font-size:15px;margin:0 0 8px;font-weight:800}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:700}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.gold{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
.btn.red{background:var(--red-soft);color:var(--red);border-color:#f3c3be}
.btn.sm{padding:4px 9px;font-size:12px}
input.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.badge{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.b-gold{background:var(--gold-soft);color:#8a6000}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:#eef0f4;color:var(--muted)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.stars{position:relative;display:inline-block;font-size:18px;line-height:1;letter-spacing:1px;direction:ltr;vertical-align:middle}
.stars .bg{color:var(--star-off)}
.stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold)}
.stars.lg{font-size:26px}
.emp{display:flex;flex-direction:column;gap:7px;cursor:pointer;transition:.15s;position:relative}
.emp:hover{border-color:var(--brand2);box-shadow:0 4px 14px rgba(15,92,76,.08)}
.emp-top{display:flex;gap:10px;align-items:center}
.ava{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.ava.win{box-shadow:0 0 0 3px var(--gold)}
.ava.xl{width:100px;height:100px;font-size:36px}
.ava.sm{width:34px;height:34px;font-size:14px}
.emp-name{font-weight:800;line-height:1.3}
.rankpill{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;border-radius:12px;padding:1px 8px;font-size:11px;font-weight:800}
.bar{height:8px;background:#eceef3;border-radius:6px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--brand2);border-radius:6px}
.bar>i.warn{background:var(--gold)} .bar>i.bad{background:var(--red)} .bar>i.cap{background:var(--purple)}
.bar .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:3px 0;gap:6px}
.kv b{color:var(--ink)}
.crit{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}
.crit:last-child{border:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:3px 10px;cursor:pointer;font-weight:800;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--brand);color:#fff}
.seg.att button.on[data-v=abs]{background:var(--red)}
.seg.att button.on[data-v=late],.seg.att button.on[data-v=vlate]{background:var(--gold);color:#3a2a00}
.seg.att button.on[data-v=off]{background:#8a90a0}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:800;background:#fafbfc;position:sticky;top:0;z-index:1}
.tbl-wrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.winner-box{background:linear-gradient(135deg,#fff8e0,#fff);border:2px solid var(--gold);border-radius:16px;padding:14px;text-align:center;min-width:170px}
.crown{font-size:28px}
.podium{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.podium .card{min-width:180px;text-align:center}
.rank{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.rank.r1{background:var(--gold);color:#3a2a00}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px 10px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:880px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;left:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;z-index:60;display:none;font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{border:1px solid var(--line);border-radius:6px;padding:3px;text-align:center;font-size:11px;min-height:42px}
.cal div.w{background:var(--gold-soft);border-color:var(--gold)}
.lock{font-size:12px;color:var(--muted);background:#fafbfc;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
/* cards */
.fcard{display:inline-block;width:12px;height:16px;border-radius:2px;vertical-align:middle;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.fcard.yellow{background:var(--yellow)} .fcard.red{background:var(--red)} .fcard.green{background:var(--green)}
.cards-line{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800}
.cardbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;cursor:pointer;font-weight:800;font-size:12px;display:inline-flex;gap:4px;align-items:center}
/* captain ribbon */
.ribbon{background:linear-gradient(120deg,#3b2a9b,#5b3fd1 60%,#7a5cf0);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px;position:relative;overflow:hidden}
.ribbon:after{content:'C';position:absolute;left:-10px;top:-30px;font-size:140px;font-weight:900;opacity:.08}
.ribbon h3{color:#fff;margin:0 0 8px}
.cap-items{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cap{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 10px;min-width:210px;flex:none}
.cap .bar{background:rgba(255,255,255,.2)} .cap .bar>i{background:#ffd54a}
.cap-c{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#ffd54a;color:#3b2a9b;font-weight:900;font-size:12px}
.honor{background:linear-gradient(135deg,#fffaf0,#fff);border:1px solid #f5dfa0}
video{max-width:100%;border-radius:12px;background:#000}
.login{max-width:360px;margin:0 auto}
.demo-flag{background:#fff3cd;color:#7a5600;border-bottom:1px solid #f0d78a;text-align:center;font-size:12px;padding:4px;font-weight:700}
@media(max-width:640px){main{padding:10px} header{position:static} nav{top:0} header h1{font-size:16px}}
/* ================= شاشة الفرع (TV) — 1920×1080 stage scaled to the screen ================= */
body.tvmode{background:#03140c;overflow:hidden;margin:0}
body.tvmode>header,body.tvmode>nav,body.tvmode>main,body.tvmode #demoFlag{display:none!important}
#tv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03140c}
.tv-stage{width:1920px;height:1080px;position:relative;overflow:hidden;transform-origin:center center;color:#fff;font-family:'Cairo',Tahoma,sans-serif;
  --g1:#fff3b0;--g2:#f6cf55;--g3:#d9a520;--g4:#9a6a05;--green:#0f6b45;--green2:#16915c;--deep:#062a1a;--ink:#e9f5ee;--muted:#9cc3ad;
  background:radial-gradient(1200px 520px at 50% -120px,rgba(255,255,255,.18),transparent 60%),
    radial-gradient(900px 600px at 15% 110%,rgba(22,145,92,.35),transparent 60%),
    radial-gradient(900px 600px at 85% 110%,rgba(22,145,92,.35),transparent 60%),
    linear-gradient(180deg,#05301d 0%,#041f13 55%,#020e08 100%)}
.tv-stage:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 120px,transparent 120px 240px)}
.tv-beams{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tv-beams i{position:absolute;top:-200px;width:260px;height:900px;background:linear-gradient(180deg,rgba(255,255,230,.22),transparent 75%);filter:blur(6px);transform-origin:top center}
.tv-beams i:nth-child(1){left:160px;transform:rotate(18deg)} .tv-beams i:nth-child(2){left:560px;transform:rotate(8deg);opacity:.6}
.tv-beams i:nth-child(3){right:560px;transform:rotate(-8deg);opacity:.6} .tv-beams i:nth-child(4){right:160px;transform:rotate(-18deg)}
@media (prefers-reduced-motion:no-preference){.tv-beams i{animation:beam 9s ease-in-out infinite alternate}.tv-beams i:nth-child(2n){animation-duration:12s}}
@keyframes beam{to{transform:rotate(0deg)}}

.tv-top{position:absolute;top:0;left:0;right:0;height:150px;display:flex;align-items:center;gap:28px;padding:0 44px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0));z-index:3}
.tv-logo{height:118px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.tv-title{display:flex;flex-direction:column;line-height:1.1}
.tv-title b{font-size:46px;font-weight:900;background:linear-gradient(180deg,var(--g1),var(--g2) 45%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.tv-title span{font-size:24px;color:var(--muted);font-weight:700}
.tv-kpis{display:flex;gap:16px;margin-inline-start:auto}
.tv-kpi{min-width:200px;padding:12px 20px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.tv-kpi b{display:block;font-size:42px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.tv-kpi span{font-size:18px;color:var(--muted);font-weight:700}
.tv-kpi.gold b{color:var(--g2)} .tv-kpi.green b{color:#5fe0a1}
.tv-clock{text-align:center;min-width:190px}
.tv-clock b{display:block;font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.tv-clock span{font-size:19px;color:var(--muted);font-weight:700}

.tv-scene{position:absolute;top:150px;bottom:88px;left:44px;right:44px;z-index:2}
.tv-scene.enter{animation:sceneIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes sceneIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
.tv-h{font-size:40px;font-weight:900;margin:6px 0 18px;display:flex;align-items:center;gap:14px}
.tv-h small{font-size:22px;color:var(--muted);font-weight:700}
.tv-glass{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.13);border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}

.tv-ticker{position:absolute;bottom:0;left:0;right:0;height:88px;display:flex;align-items:center;z-index:3;
  background:linear-gradient(90deg,#0b3d24,#0f6b45 50%,#0b3d24);border-top:3px solid var(--g3);overflow:hidden}
.tv-ticker .lbl{flex:none;height:100%;display:flex;align-items:center;gap:10px;padding:0 26px;font-size:28px;font-weight:900;color:#3a2600;
  background:linear-gradient(180deg,var(--g1),var(--g2) 50%,var(--g3));z-index:1;box-shadow:8px 0 20px rgba(0,0,0,.35)}
.tv-run{position:absolute;top:50%;margin-top:-24px;inset-inline-start:0;white-space:nowrap;font-size:30px;font-weight:800;display:inline-flex;gap:70px;padding-inline-start:70px;will-change:transform}
@media (prefers-reduced-motion:no-preference){.tv-run{animation:tick var(--dur,60s) linear infinite}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
.tv-dots{position:absolute;top:150px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:3}
.tv-dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)} .tv-dots i.on{background:var(--g2);width:38px;border-radius:8px}

/* photos */
.tv-ph{border-radius:50%;object-fit:cover;background:linear-gradient(160deg,#1d7a52,#0b3d24);display:flex;align-items:center;justify-content:center;font-weight:900;color:#e9f5ee;flex:none}
.tv-ring{padding:6px;border-radius:50%;background:conic-gradient(from 200deg,var(--g1),var(--g3),var(--g4),var(--g2),var(--g1));box-shadow:0 0 40px rgba(246,207,85,.45)}

/* day winners */
.tv-day{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;height:100%}
.tv-winners{position:relative;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:20px;overflow:hidden}
.tv-award{position:relative;width:440px;padding:22px 22px 26px;border-radius:30px;text-align:center;
  background:radial-gradient(260px 180px at 50% 10%,rgba(255,240,180,.25),transparent 70%),linear-gradient(180deg,rgba(17,90,58,.95),rgba(6,42,26,.95));
  border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 3px var(--g3),0 30px 70px rgba(0,0,0,.55)}
.tv-award.sm{width:340px;padding:16px} .tv-award.xs{width:292px;padding:12px 12px 16px}
.tv-crown{font-size:70px;line-height:1;margin-top:-58px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tv-award .nm{margin-top:12px;padding:10px 14px;border-radius:14px;font-size:38px;font-weight:900;color:#3a2600;line-height:1.15;
  background:linear-gradient(180deg,var(--g1),var(--g2) 45%,var(--g3));box-shadow:0 6px 0 var(--g4)}
.tv-award.sm .nm{font-size:30px} .tv-award.xs .nm{font-size:25px}
.tv-award .meta{margin-top:12px;font-size:22px;color:var(--muted);font-weight:700}
.tv-award .prize{display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:8px 20px;border-radius:30px;font-size:28px;font-weight:900;color:#fff;background:linear-gradient(180deg,#1ea56a,#0f6b45);border:2px solid var(--g2)}
.tv-award .medal{position:absolute;top:18px;inset-inline-end:14px;width:96px}
.tv-award.sm .medal{width:78px} .tv-award.xs .medal{width:64px}
.tv-rank{display:flex;flex-direction:column;padding:22px 26px}
.tv-row{display:flex;align-items:center;gap:18px;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.08);font-size:28px}
.tv-row:last-child{border:0}
.tv-row .pos{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;background:rgba(255,255,255,.1);flex:none}
.tv-row .pos.p1{background:linear-gradient(180deg,var(--g1),var(--g3));color:#3a2600} .tv-row .pos.p2{background:linear-gradient(180deg,#f4f6f8,#9aa4ae);color:#2a3138} .tv-row .pos.p3{background:linear-gradient(180deg,#f3c49b,#a8622b);color:#3a1d05}
.tv-row .who{flex:1;min-width:0;line-height:1.2}
.tv-row .who b{display:block;font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-row .who span{font-size:20px;color:var(--muted);font-weight:700}
.tv-row .sc{font-size:34px;font-weight:900;color:var(--g2);font-variant-numeric:tabular-nums}
.tv-stars{color:var(--g2);font-size:26px;letter-spacing:2px;direction:ltr;position:relative;display:inline-block}
.tv-stars .bg{color:rgba(255,255,255,.18)} .tv-stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap}
.tv-code{display:inline-block;margin-inline-start:8px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.12);font-size:19px;font-weight:800;color:#d8efe2}

/* departments league */
.tv-league{height:100%;display:flex;flex-direction:column;padding:26px 34px}
.tv-bars{flex:1;display:flex;align-items:flex-end;gap:14px;position:relative;padding:40px 10px 0;border-bottom:3px solid rgba(255,255,255,.2)}
.tv-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.tv-bar .v{font-size:36px;font-weight:900;margin-bottom:8px;font-variant-numeric:tabular-nums}
.tv-bar .col{width:100%;max-width:150px;border-radius:16px 16px 4px 4px;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 12px 30px rgba(0,0,0,.35)}
.tv-bar .col.ok{background:linear-gradient(180deg,#5fe0a1,#16915c)} .tv-bar .col.mid{background:linear-gradient(180deg,#ffd76a,#e09a12)} .tv-bar .col.low{background:linear-gradient(180deg,#ff8a7a,#c8372d)}
.tv-bar .lb{position:absolute;bottom:-62px;font-size:21px;font-weight:800;text-align:center;line-height:1.1;width:100%}
.tv-pace{position:absolute;left:0;right:0;border-top:3px dashed rgba(255,255,255,.65);z-index:1}
.tv-pace span{position:absolute;top:-38px;inset-inline-start:0;font-size:20px;font-weight:800;background:rgba(0,0,0,.45);padding:2px 12px;border-radius:10px}
.tv-bar .tv-capb{position:absolute;top:-12px;inset-inline-end:-6px;width:44px;height:44px;border-radius:50%;background:#ffd54a;color:#3b2a9b;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.4)}

/* captain */
.tv-caps{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}

  box-shadow:0 0 0 .22em var(--halo),0 0 1.1em .25em var(--halo),inset 0 0 1.2em var(--halo)}

// ---------- storage (IndexedDB, until Supabase is live) ----------
let S=null; const DBN='najm-kpi-v2', ST='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function load(){
  try{const db=await idb();S=await new Promise(res=>{const t=db.transaction(ST).objectStore(ST).get('state');t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});}catch(e){S=null}
  normalize();
}
function normalize(){
  if(!S) S=defaultState();
  const d=defaultState();
  S.settings=Object.assign(d.settings,S.settings||{});
  for(const k of Object.keys(d)) if(S[k]===undefined) S[k]=d[k];
}
let saveT=null;
function save(){RANK_CACHE=null;SALES_CACHE={};if(LIVE||DEMO)return;clearTimeout(saveT);saveT=setTimeout(async()=>{try{const db=await idb();db.transaction(ST,'readwrite').objectStore(ST).put(S,'state');}catch(e){toast('⚠️ تعذّر الحفظ')}},250);}

const prevMonth=m=>{let y=+m.slice(0,4),mo=+m.slice(5,7)-1;if(mo<1){mo=12;y--;}return `${y}-${pad(mo)}`;};

// ---------- scoring (same rules as the database function najm_score) ----------
function day(d){return S.days[d]||(S.days[d]={att:{},attTime:{},br:{},sh:{},fr:{},ops:{},hy:{},bonus:{},winners:{},pub:{},full:{}});}
function mark(D,code){(D.full||(D.full={}))[code]=1;}
const EMPTY_DAY={att:{},attTime:{},br:{},sh:{},fr:{},ops:{},hy:{},bonus:{},winners:{}};
function peekDay(d){return S.days[d]||EMPTY_DAY;}
const q25=x=>Math.round(x*4)/4;
function crit(arr){if(!arr||arr.length<5||arr.some(v=>v==null))return null;return q25(arr.reduce((a,b)=>a+b,0)/10);}
const isFresh=e=>(S.settings.freshDepts||[]).includes(e?.dept);
function score(d,code){
  const D=peekDay(d);const st=D.att[code];const e=emp(code);
  const P=D.pub?.[code];
  if(P&&!D.full?.[code]){const a=P.att==null||P.att==='off'?null:(S.settings.att[P.att]??0);return {st:P.att,att:a,mgr:null,ops:null,parts:{},fresh:isFresh(e),bonus:P.bonus?.5:0,total:P.total,complete:P.complete,pub:true};}
  const att=st==null||st==='off'?null:(S.settings.att[st]??0);
  const b=crit(D.br[code]),s=crit(D.sh[code]),f=crit(D.fr[code]),o=crit(D.ops[code]),h=crit(D.hy?.[code]);
  const fresh=isFresh(e);
  let mgr,mc;
  if(fresh){mgr=b==null&&s==null&&f==null?null:q25(((b||0)+(s||0)+(f||0))/3);mc=b!=null&&s!=null&&f!=null;}
  else{mgr=b==null&&s==null?null:q25(((b||0)+(s||0))/2);mc=b!=null&&s!=null;}
  const bonus=D.bonus[code]?.v||0;
  const any=att!=null||mgr!=null||o!=null||h!=null||bonus>0;
  const total=any?Math.min(5,(att||0)+(mgr||0)+(o||0)+(h||0)+bonus):null;
  return {st,att,mgr,ops:o,hy:h,parts:{br:b,sh:s,fr:f},fresh,bonus,total,complete:att!=null&&mc&&o!=null};
}

function cardCount(code,month,upto){if(LIVE&&S.cardCounts)return S.cardCounts[code]||{y:0,r:0,g:0};const L=cardsOf(code,month+'-01',upto||month+'-31');return {y:L.filter(c=>c.color==='yellow').length,r:L.filter(c=>c.color==='red').length,g:L.filter(c=>c.color==='green').length};}
function cardPts(c){const k=S.settings.cards;const extraRed=Math.floor(c.y/(k.yellowsToRed||2));const y=c.y%(k.yellowsToRed||2);return (c.r+extraRed)*k.red+y*k.yellow+c.g*k.green;}
const redOn=(d,code)=>(S.cards||[]).some(c=>c.code===code&&c.date===d&&c.color==='red'&&c.approved);
function cardsHTML(c){if(!c.y&&!c.r&&!c.g)return '';return `<span class="cards-line">${c.y?`<span><i class="fcard yellow"></i> ${fmt(c.y)}</span>`:''}${c.r?`<span><i class="fcard red"></i> ${fmt(c.r)}</span>`:''}${c.g?`<span><i class="fcard green"></i> ${fmt(c.g)}</span>`:''}</span>`;}

function rankGroup(d,list){
  return list.map(e=>({e,s:score(d,e.code)}))
    .filter(x=>x.s.total!=null&&x.s.st!=='abs'&&x.s.st!=='off'&&!redOn(d,x.e.code))
    .sort((a,b)=>b.s.total-a.s.total||(b.s.att||0)-(a.s.att||0)||(b.s.ops||0)-(a.s.ops||0)||(b.s.mgr||0)-(a.s.mgr||0));
}

// ---------- targets ----------
let SALES_CACHE={};
function salesAgg(month,branch,upto){
  if(LIVE&&S.salesSum){return S.salesSum.month===month?(S.salesSum.data[branch]||{}):{};}
  const ck=month+'|'+branch+'|'+(upto||'');if(SALES_CACHE[ck])return SALES_CACHE[ck];
  const out=SALES_CACHE[ck]={};
  for(const d of monthDays(month,upto)){const b=S.sales[d]?.[branch];if(!b)continue;for(const[k,v]of Object.entries(b)){(out[k]||(out[k]={name:v.name,qty:0})).qty+=v.qty;}}
  return out;
}
const pts=p=>p==null?null:p<50?0:p<85?50:Math.round(p);
function deptProgress(month,branch,dept,upto,empCode){
  const cfg=S.targets[month]?.[deptKey(branch,dept)];
  if(!cfg) return null;
  const cap=S.settings.capPct;
  if(cfg.type==='sales'){
    const agg=salesAgg(month,branch,upto);
    const items=(cfg.items||[]).map(it=>{const sold=agg[it.key]?.qty||0;const p=it.target>0?Math.min(cap,sold/it.target*100):null;return {...it,sold,pct:p};});
    const T=items.reduce((a,i)=>a+(+i.target||0),0), Sd=items.reduce((a,i)=>a+Math.min(i.sold,(+i.target||0)*cap/100),0);
    const pct=T>0?Sd/T*100:null; // department total (kilos/units) vs total target
    return {type:'sales',items,pct,points:pts(pct),pace:upto?(monthDays(month,upto).length/daysInMonth(month)*100):null};
  }
  const days=monthDays(month,upto);const key=deptKey(branch,dept);
  const kpis=(cfg.kpis||[]).map(k=>{
    if(k.kind==='mgr'){ // average direct-manager star (0..1) from the daily ratings — per employee, or the department average
      const codes=empCode?[empCode]:activeEmps().filter(e=>e.branch===branch&&e.dept===dept).map(e=>e.code);
      const vs=[];for(const d of days)for(const c of codes){const m=score(d,c).mgr;if(m!=null)vs.push(m);}
      const val=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;
      return {...k,val:val==null?null:val*100,pct:val==null||!(k.target>0)?null:Math.min(cap,val*100/k.target*100),n:vs.length};
    }
    const vals=days.map(d=>S.kpiVals[d]?.[key]?.[k.id]).filter(v=>v!=null&&v!=='');
    let pct=null,val=null;
    if(vals.length){
      if(k.kind==='score'){val=vals.reduce((a,b)=>a+ +b,0)/vals.length;pct=k.target>0?Math.min(cap,val/k.target*100):null;}
      else if(k.kind==='count'){val=vals.reduce((a,b)=>a+ +b,0);pct=k.target>0?Math.min(cap,val/k.target*100):null;}
      else {val=vals.reduce((a,b)=>a+ +b,0);const t=+k.target||0;pct=val<=t?100:Math.max(0,100*(1-(val-t)/Math.max(t,1)));}
    }
    return {...k,val,pct,n:vals.length};
  });
  const v=kpis.filter(k=>k.pct!=null);const w=v.reduce((a,k)=>a+(+k.weight||1),0);
  const pct=v.length?v.reduce((a,k)=>a+k.pct*(+k.weight||1),0)/w:null;
  return {type:'manual',kpis,pct,points:pts(pct),pace:null};
}
// captain = personal extra target: each salesperson / chef gets one or more products; measured by the kilos the branch sold of it (Foodics sheet)
function captainsOfEmp(e,month,upto,onlyActive=true){
  const L=S.captains[month]?.[e.code]||[];if(!L.length)return [];
  const agg=salesAgg(month,e.branch,upto);const cap=S.settings.capPct;const mult=S.settings.captainMult||3;
  return L.filter(c=>!onlyActive||c.active!==false).map(c=>{const sold=agg[c.sku]?.qty||0;const pct=c.target>0?Math.min(cap,sold/c.target*100):null;const p=pts(pct);return {...c,code:e.code,branch:e.branch,dept:e.dept,sold,pct,points:p==null?null:p*mult};});
}
function captainsIn(month,upto,pred){const out=[];for(const e of activeEmps())if(pred(e))out.push(...captainsOfEmp(e,month,upto));return out;}
function complaintsOf(code,month){return S.complaints.filter(c=>c.code===code&&c.date.startsWith(month));}
function empTarget(e,month,upto){
  const dp=deptProgress(month,e.branch,e.dept,upto,e.code);
  const caps=captainsOfEmp(e,month,upto);
  const capPts=caps.reduce((a,c)=>a+(c.points||0),0);
  if(!dp&&!caps.length) return null;
  const base=dp?.points??null;
  const cc=complaintsOf(e.code,month).length;
  const raw=(base||0)+capPts;
  const has=base!=null||caps.length>0;
  const empPoints=has?Math.round(cc?raw*(1-S.settings.complaintPenalty/100):raw):null;
  return {...(dp||{pct:null,pace:null}),basePoints:base,caps,capPts,empPoints,complaints:cc};
}

function monthSummary(e,month,upto){
  const days=monthDays(month,upto);let n=0,sum=0,wins=0,abs=0,late=0;
  for(const d of days){const s=score(d,e.code);if(s.st==='abs')abs++;if(s.st==='late'||s.st==='vlate')late++;if(s.total!=null&&s.st!=='abs'){n++;sum+=s.total;}if(isWinner(d,e.code))wins++;}
  const avg=n?sum/n:null;const cards=cardCount(e.code,month,upto);const cp=cardPts(cards);
  const monthScore=avg!=null?Math.max(0,Math.round(avg/5*100+cp)):null;
  return {n,avg,wins,abs,late,cards,cardPts:cp,monthScore,target:empTarget(e,month,upto)};
}
// المسار التاني: التارجت (القسم + الكابتن) — نسبة "على المسار" (مبيعات نص الشهر بتتقارن باللي المفروض لحد النهارده)
function tgtOf(t,month,upto){
  if(!t)return null;const cap=S.settings.capPct||120;
  const pace=upto&&upto<monthOf(upto)+'-'+pad(daysInMonth(month))?monthDays(month,upto).length/daysInMonth(month)*100:100;
  const adj=p=>p==null?null:Math.min(cap,pace>0?p/pace*100:p);
  const dept=t.type==='sales'?adj(t.pct):t.pct==null?null:Math.min(cap,t.pct);
  const cps=(t.caps||[]).map(c=>adj(c.pct)).filter(v=>v!=null);const capv=cps.length?cps.reduce((a,b)=>a+b,0)/cps.length:null;
  const v=dept!=null&&capv!=null?(dept+capv)/2:dept??capv;
  return {v:v==null?null:Math.round(v),dept,capv,pace,type:t.type,t};
}
const KPI_G=()=>+S.settings.goal||85, TGT_G=()=>+S.settings.targetGoal||85;
function qualify(ms,tg){const k=ms.monthScore,t=tg?.v;return {kOk:k!=null&&k>=KPI_G(),tOk:t!=null&&t>=TGT_G(),ok:k!=null&&k>=KPI_G()&&t!=null&&t>=TGT_G()};}
let RANK_CACHE=null;
function ranks(){
  const key=DATE;
  if(RANK_CACHE&&RANK_CACHE.key===key)return RANK_CACHE;
  const m=monthOf(DATE);
  const rows=activeEmps().map(e=>{const ms=monthSummary(e,m,DATE);const tg=tgtOf(ms.target,m,DATE);return {e,ms,tg,q:qualify(ms,tg)};}).filter(x=>x.ms.n>0||x.ms.wins>0);
  const both=x=>(x.ms.monthScore||0)+Math.min(100,x.tg?.v||0);
  rows.sort((a,b)=>(b.q.ok-a.q.ok)||b.ms.wins-a.ms.wins||both(b)-both(a)||(b.ms.target?.empPoints||0)-(a.ms.target?.empPoints||0));
  const company={},branch={},bc={};
  rows.forEach((x,i)=>{company[x.e.code]=i+1;bc[x.e.branch]=(bc[x.e.branch]||0)+1;branch[x.e.code]=bc[x.e.branch];});
  const sum={},ok={},tg={};rows.forEach(x=>{sum[x.e.code]=x.ms;ok[x.e.code]=x.q.ok;tg[x.e.code]=x.tg;});
  RANK_CACHE={key,rows,company,branch,bc,sum,ok,tg,total:rows.length,qualified:rows.filter(x=>x.q.ok)};return RANK_CACHE;
}
const prizeRank=code=>{const R=ranks();return R.ok[code]?R.company[code]:null;};
const msOf=e=>ranks().sum[e.code]||monthSummary(e,monthOf(DATE),DATE);

function setAtt(code,v){const D=day(DATE);mark(D,code);D.att[code]===v?delete D.att[code]:D.att[code]=v;save();render();push('att',{day:DATE,code},D.att[code]?{st:D.att[code],time:D.attTime[code]||null}:null);}

async function toggleBonus(code){

  const note=await askText('إيه الفعل المثالي اللي عمله؟');if(note===null)return;if(!note.trim()){toast('لازم تكتب السبب');return;}
  D.bonus[code]={v:.5,note:note.trim(),by:USER.username};save();render();push('bonus',{day:DATE,code},{v:.5,note:note.trim()});

// attendance import
function pickFile(accept,cb){const f=$('#filePick');f.value='';f.accept=accept;f.onchange=()=>f.files[0]&&cb(f.files[0]);f.click();}
function readSheet(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];res(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));}catch(e){rej(e)}};r.onerror=rej;r.readAsArrayBuffer(file);});}
function findHeader(rows,tests){
  for(let i=0;i<Math.min(rows.length,20);i++){const h=rows[i].map(norm);const idx={};for(const[k,re]of Object.entries(tests))idx[k]=h.findIndex(c=>re.test(c));if(Object.values(idx).filter(x=>x>=0).length>=2)return {row:i,idx};}
  return null;
}
const toMin=t=>{const m=String(t).match(/(\d{1,2}):(\d{2})/);if(!m)return null;let h=+m[1];if(/pm|م/i.test(t)&&h<12)h+=12;return h*60+ +m[2];};
function importAttendance(){
  pickFile('.xlsx,.xls,.csv',async f=>{
    let rows;try{rows=await readSheet(f);}catch(e){toast('الملف مش مقروء');return;}
    const H=findHeader(rows,{code:/^(كود|الكود|code|رقم الموظف|id)/,att:/^(atte|حضور|الحاله|الحالة|status)/,time:/(وقت الحضور|check ?in|in time|الدخول)/});
    if(!H||H.idx.code<0){toast('مش لاقي عمود الكود');return;}
    const D=day(DATE);let n=0;const changed=[];
    for(const r of rows.slice(H.row+1)){
      const code=String(r[H.idx.code]||'').trim();const e=emp(code);if(!e||!inScope(e))continue;
      const a=H.idx.att>=0?norm(r[H.idx.att]):'';const tm=H.idx.time>=0?String(r[H.idx.time]||'').trim():'';
      let st=null;
      if(tm&&toMin(tm)!=null){const diff=toMin(tm)-toMin(S.settings.shiftStart[e.shift]||'09:00');st=diff<=S.settings.graceMin?'on':diff<=S.settings.lateMax?'late':'vlate';D.attTime[code]=tm;}
      else if(a){st=/غياب|absent/.test(a)?'abs':/حضور|present/.test(a)?'on':/اجاز|off/.test(a)?'off':null;}
      if(st){mark(D,code);D.att[code]=st;n++;changed.push(code);}
    }
    save();render();
    for(let i=0;i<changed.length;i+=10)await Promise.all(changed.slice(i,i+10).map(c=>push('att',{day:DATE,code:c},{st:D.att[c],time:D.attTime[c]||null})));
    toast(`اتسجل حضور ${n} موظف`);
  });
}

      <label class="small">الفرع<br><select class="inp" ${USER?.branch?'disabled':''} onchange="IMP.branch=this.value">${branches().map(b=>`<option ${b===guess?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
      ${sel('code','كود المنتج')}${sel('name','اسم المنتج')}${sel('qty','الكمية')}</div>

  });

function parseImp(){
  const {rows,H}=IMP;const out={};
  for(const r of rows.slice(H.row+1)){
    const code=H.idx.code>=0?String(r[H.idx.code]||'').trim():'';const name=H.idx.name>=0?String(r[H.idx.name]||'').trim():'';
    const qty=parseFloat(String(r[H.idx.qty]??'').replace(/,/g,''));
    if((!code&&!name)||isNaN(qty)||/اجمالي|إجمالي|total/i.test(name)||norm(name)==='محذوف')continue;
    const key=code||norm(name);(out[key]||(out[key]={name:name||code,qty:0})).qty+=qty;
  }
  return out;
}
function previewImp(){const el=$('#impPrev');if(!el)return;const o=parseImp();const L=Object.values(o);el.innerHTML=`<div class="small"><b>${esc(IMP.branch)}</b>: ${fmt(L.length)} صنف · إجمالي كميات ${fmt(L.reduce((a,x)=>a+x.qty,0),1)}</div>`;}

  const o=parseImp();if(!Object.keys(o).length){toast('مفيش بيانات');return;}

}

function saveEmp(code){

  const e=code?emp(code):{code:c,photo:'',video:''};
  Object.assign(e,{name:v('f_name'),branch:v('f_branch'),dept:v('f_dept'),job:v('f_job'),shift:v('f_shift'),active:$('#f_active').checked});
  if(!code)S.employees.push(e);save();closeModal();render();push('employee',{code:e.code},{name:e.name,branch:e.branch,dept:e.dept,job:e.job,shift:e.shift,active:e.active});

function importEmps(){
  pickFile('.xlsx,.xls,.csv',async f=>{
    let rows;try{rows=await readSheet(f);}catch(e){toast('الملف مش مقروء');return;}
    const H=findHeader(rows,{code:/^(كود|الكود)$/,name:/اسم الموظف/,shift:/الشيفت/,branch:/^الفرع/,status:/حاله الموظف|حالة الموظف/,dept:/^القسم/,job:/الوظيف/});
    if(!H||H.idx.code<0||H.idx.name<0){toast('لازم «كود» و«اسم الموظف»');return;}
    let add=0,upd=0;const touched=[];
    for(const r of rows.slice(H.row+1)){
      const code=String(r[H.idx.code]||'').trim(),name=String(r[H.idx.name]||'').trim();if(!code||!name||name==='#N/A')continue;
      const g=k=>H.idx[k]>=0?String(r[H.idx[k]]||'').trim():'';const active=H.idx.status>=0?/راس العمل/.test(g('status')):true;
      const sh=g('shift');const br=branches().find(b=>norm(b)===norm(g('branch')))||g('branch');let e=emp(code);
      if(e){Object.assign(e,{name,branch:br||e.branch,dept:g('dept')||e.dept,job:g('job')||e.job,shift:Object.values(SH).includes(sh)?sh:e.shift,active});upd++;touched.push(e);}
      else if(active){const ne={code,name,branch:br,dept:g('dept'),job:g('job'),shift:Object.values(SH).includes(sh)?sh:'Morning',active,photo:'',video:''};S.employees.push(ne);add++;touched.push(ne);}
    }
    save();render();for(let i=0;i<touched.length;i+=10)await Promise.all(touched.slice(i,i+10).map(e=>push('employee',{code:e.code},{name:e.name,branch:e.branch,dept:e.dept,job:e.job,shift:e.shift,active:e.active})));toast(`جديد ${add} · اتحدّث ${upd}`);
  });
}

async function saveUser(name){
  const g=id=>$('#'+id).value.trim();const un=(name||g('u_user')).toLowerCase();

  if(!u){u={username:un};S.users.push(u);}
  const ec=(g('u_emp').split('—')[0]||'').trim();
  Object.assign(u,{name:g('u_name'),role:g('u_role'),branch:g('u_branch'),shift:g('u_shift'),depts:g('u_depts').split(/[،,]/).map(x=>x.trim()).filter(Boolean),active:$('#u_active').checked,emp_code:emp(ec)?ec:''});
  if(g('u_pin'))u.pin=g('u_pin');
  save();closeModal();render();

  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sum),'ملخص الشهر');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.cards.filter(c=>c.date.startsWith(m)).map(c=>({'اليوم':c.date,'الكود':c.code,'الاسم':emp(c.code)?.name,'الكارت':CARD[c.color].t,'السبب':c.reason,'من':c.by,'محسوب':c.approved?'✔':'⏳'}))),'الكروت');
  XLSX.writeFile(wb,`najm-${m}.xlsx`);
}

let TVB=null, TV_I=0, TV_TIMER=null, TV_SEEN=null, TV_SPOT=0, TV_READY=false;
const TV_SEC=15;
function tvInit(branch){
  TVB=branches().includes(branch)?branch:branches()[0];
  document.body.classList.add('tvmode');
  const d=document.createElement('div');d.id='tv';
  d.innerHTML=`<div class="tv-stage" id="tvStage"><div class="tv-beams"><i></i><i></i><i></i><i></i></div>
    <div class="tv-top"><img class="tv-logo" src="${LOGO_WHITE}" alt="أبو الفضل"><div class="tv-title"><b>دوري نجوم أبو الفضل</b><span id="tvBranch"></span></div>
      <div class="tv-kpis" id="tvKpis"></div><div class="tv-clock"><b id="tvTime">--:--</b><span id="tvDate"></span></div></div>
    <section class="tv-scene" id="tvScene"></section><div class="tv-dots" id="tvDots"></div>
    <footer class="tv-ticker"><div class="lbl">⚡ أخبار الدوري</div><div style="flex:1;height:100%;overflow:hidden;position:relative"><div class="tv-run" id="tvRun"></div></div></footer></div>`;
  document.body.appendChild(d);
  const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);$('#tvStage').style.transform=`scale(${s})`;};
  addEventListener('resize',fit);fit();
  const tick=()=>{const n=new Date();$('#tvTime').textContent=n.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});$('#tvDate').textContent=n.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});};
  tick();setInterval(tick,1000);
  setInterval(()=>{const today=ymd(new Date());if(DATE!==today){DATE=today;RANK_CACHE=null;LIVE?refresh(true):tvUpdate();}},60000);
}
// the most recent day (today or up to 3 days back) whose man of the day was announced for this branch
function tvWinnerDay(){for(let i=0;i<4;i++){const d=new Date(DATE);d.setDate(d.getDate()-i);const k=ymd(d);const W=Object.entries(peekDay(k).winners||{}).filter(([g])=>g.startsWith(TVB+'|'));if(W.length)return {day:k,list:W.flatMap(([g,codes])=>codes.map(c=>({e:emp(c),sh:g.split('|')[1]}))).filter(x=>x.e)};}return null;}
function tvScenes(){
  const L=[sceneDay];
  const m=monthOf(DATE);
  if(deptsOf(TVB).some(d=>deptProgress(m,TVB,d,DATE)?.pct!=null))L.push(sceneLeague);
  if(captainsIn(m,DATE,e=>e.branch===TVB).length)L.push(sceneCaptain);
  if(ranks().rows.length)L.push(sceneCups,scenePlayer);
  if(managers().length)L.push(sceneManagers);
  if((S.market||[]).some(x=>['listed','decided','approved'].includes(x.status)))L.push(sceneMarket);
  return L;
}
function tvUpdate(){
  if(!TVB)return;
  $('#tvBranch').textContent=`${TVB} · ${monthName(monthOf(DATE))}`;
  // KPIs
  const L=activeEmps().filter(e=>e.branch===TVB);const D=peekDay(DATE);
  const pres=L.filter(e=>{const st=D.att[e.code];return st&&st!=='abs'&&st!=='off';}).length;
  const sc=L.map(e=>score(DATE,e.code).total).filter(v=>v!=null);const avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null;
  const m=monthOf(DATE);const tg=deptsOf(TVB).map(d=>deptProgress(m,TVB,d,DATE)).filter(x=>x&&x.pct!=null);const tp=tg.length?tg.reduce((a,x)=>a+x.pct,0)/tg.length:null;
  const greens=L.reduce((a,e)=>a+(cardCount(e.code,m,DATE).g||0),0);
  $('#tvKpis').innerHTML=`<div class="tv-kpi"><b>${fmt(pres)}<small style="font-size:24px;color:var(--muted)"> / ${fmt(L.length)}</small></b><span>حضور النهارده</span></div>
    <div class="tv-kpi gold"><b>${avg!=null?fmt(avg,1)+' ★':'—'}</b><span>متوسط نجوم الفرع</span></div>
    <div class="tv-kpi"><b>${tp!=null?fmt(tp)+'%':'—'}</b><span>متوسط تارجت الأقسام</span></div>
    <div class="tv-kpi green"><b>🟩 ${fmt(greens)}</b><span>كروت خضرا الشهر</span></div>`;
  tvTicker();tvCelebrateCheck();
  if(!TV_TIMER){tvShow(0);TV_TIMER=setInterval(()=>tvShow(TV_I+1),TV_SEC*1000);} else tvShow(TV_I,true);
}

const MGR_DEF={rating:1,winner:20,gold:100,silver:60,bronze:40,top10:20,red:-10,bonus:50};

function inScopeOf(u,e){if(!u||!e||u.role==='ops')return false;if(u.branch&&e.branch!==u.branch)return false;if(u.role==='shift'&&e.shift!==u.shift)return false;if(u.role==='fresh'&&!(u.depts||[]).includes(e.dept))return false;return true;}

function mgrMonth(u,month,upto){
  const P=mgrPts();const days=monthDays(month,upto);let rating=0,wins=0,reds=0,cups=0;
  for(const d of days){rating+=mgrDayPts(d,u.username);for(const codes of Object.values(peekDay(d).winners||{}))for(const c of codes)if(inScopeOf(u,emp(c)))wins++;}
  const R=ranks();const team=activeEmps().filter(e=>inScopeOf(u,e));
  for(const e of team){const t=cupOf(prizeRank(e.code));if(t)cups+=P[t];reds+=cardCount(e.code,month,upto).r||0;}
  return {rating,wins,cups,reds,team:team.length,total:Math.round(rating*P.rating+wins*P.winner+cups+reds*P.red)};
}
const balanceOf=un=>(S.ledger||[]).filter(l=>l.username===un).reduce((a,l)=>a+(+l.points||0),0);
const MGR_W=()=>Object.assign({ops:50,team:25,votes:25},S.settings.mgrWeights||{});
const votesOf=un=>(LIVE?S.voteCounts?.[un]?.votes:(S.votes||[]).filter(v=>v.month===monthOf(DATE)&&v.manager===un).length)||0;
function mgrScore(u,month,upto){
  const days=monthDays(month,upto);let s=0,n=0;for(const d of days){const has=S.mgrDaily?.[d]?.[u.username]!=null||S.mgrCrit?.[d]?.[u.username];if(has){s+=mgrDayPts(d,u.username);n++;}}
  const ops=n?s/n/10*100:0;
  const team=activeEmps().filter(e=>inScopeOf(u,e)).map(e=>msOf(e).monthScore).filter(v=>v!=null);const teamPct=team.length?team.reduce((a,b)=>a+b,0)/team.length:0;
  const maxV=Math.max(0,...managers().map(x=>votesOf(x.username)));const v=votesOf(u.username);const votePct=maxV?v/maxV*100:0;
  const W=MGR_W();return {opsPct:ops,teamPct,votes:v,votePct,score:Math.round((ops*W.ops+teamPct*W.team+votePct*W.votes)/(W.ops+W.team+W.votes))};
}

// =========================================================
// كارت اللاعب (زي FIFA): السيلز · الانضباط · السلوك · القدرة الخاصة · المثالية → التقييم المجمّع
// =========================================================
const FUT_W={sales:.30,disc:.20,beh:.20,skill:.15,ideal:.15};
const clamp99=v=>Math.max(30,Math.min(99,Math.round(v)));
// raw inputs for the month: attendance counts, criteria averages (0..2), exemplary-behavior count
function cardRaw(code,month,upto){
  if(LIVE&&S.cardStats)return S.cardStats[code]||null;
  let on=0,late=0,vlate=0,abs=0,bonus=0;const sum=[0,0,0,0,0],cnt=[0,0,0,0,0];
  for(const d of monthDays(month,upto)){const D=peekDay(d);const st=D.att[code];if(st==='on')on++;else if(st==='late')late++;else if(st==='vlate')vlate++;else if(st==='abs')abs++;
    if(D.bonus[code])bonus++;for(const f of ['br','sh','fr','ops']){const a=D[f][code];if(a&&a.length===5&&a.every(x=>x!=null))a.forEach((x,i)=>{sum[i]+=x;cnt[i]++;});}}
  const c=sum.map((s,i)=>cnt[i]?s/cnt[i]:null);
  if(!on&&!late&&!vlate&&!abs&&c.every(x=>x==null))return null;
  return {on_n:on,late_n:late,vlate_n:vlate,abs_n:abs,c1:c[0],c2:c[1],c3:c[2],c4:c[3],c5:c[4],bonus_n:bonus};
}
function futStats(e){
  const m=monthOf(DATE);const R=cardRaw(e.code,m,DATE);const ms=msOf(e);const t=ms.target;const k=ms.cards||{y:0,r:0,g:0};
  const avg=(...v)=>{v=v.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  // السيلز: تارجت القسم + الكابتن الشخصي (للأقسام التشغيلية: النضافة وتقييم المدير)
  const pcts=[t?.pct,...(t?.caps||[]).map(c=>c.pct)].filter(x=>x!=null);
  const sales=pcts.length?clamp99(35+avg(...pcts)*0.6):null;
  // الانضباط: البصمة
  const days=R?(R.on_n+R.late_n+R.vlate_n+R.abs_n):0;
  const disc=days?clamp99(35+((R.on_n*100+R.late_n*60+R.vlate_n*30)/days)*0.64):null;
  // السلوك: تنفيذ التعليمات + الإيجابية − الكروت
  const b=R?avg(R.c1,R.c5):null;
  const beh=b!=null?clamp99(35+(b/2*100)*0.64-8*k.y-25*k.r):null;
  // القدرة الخاصة: سرعة التنفيذ + التطور + السلوك المثالي
  const s=R?avg(R.c2,R.c4):null;
  const skill=s!=null?clamp99(35+(s/2*100)*0.64+3*(R.bonus_n||0)):null;
  // المثالية: الكروت الخضرا + السلوك المثالي + رجل اليوم
  const ideal=(R||k.g||ms.wins)?clamp99(55+9*k.g+6*(R?.bonus_n||0)+3*ms.wins-5*k.y-15*k.r):null;
  const st={sales,disc,beh,skill,ideal};
  let w=0,sum=0;for(const[kk,v]of Object.entries(st))if(v!=null){w+=FUT_W[kk];sum+=v*FUT_W[kk];}

    const x=50+r*Math.cos(t),y=50+r*Math.sin(t);           // left branch (bottom → up the left side)

}

  // personal captains
  const C=S.captains[m]={};const prodOf=dept=>Object.entries(cat).filter(([,c])=>c.dept===dept).map(([s])=>s);
  for(const br of [B,A])for(const dept of ['قسم البقاله','قسم الفاكهه','قسم الايس كريم','bakery']){const team=activeEmps().filter(e=>e.branch===br&&e.dept===dept).slice(0,3);const P=prodOf(dept);
    team.forEach((e,i)=>{const sku=P[i%P.length];C[e.code]=[{sku,name:cat[sku].name,target:Math.round(base[br][sku].qty*(1.1+rnd()*.4)),active:true,by:'haitham'}];});}
  // managers: daily ratings, last month's wallet, a transfer market in progress
  S.mgrCrit={};for(const d of days){S.mgrCrit[d]={};for(const u of S.users.filter(x=>x.role!=='ops'))S.mgrCrit[d][u.username]=Array.from({length:5},()=>rnd()<.7?2:1);}
  const w={haitham:340,mahmoud:180,islam:260,firas:210,abdelrahman:230};for(const[u,p]of Object.entries(w))S.ledger.push({id:`close|${pm}|${u}`,username:u,month:pm,points:p,reason:`نقاط ${monthName(pm)}`});
  S.ledger.push({id:`bonus|${pm}|haitham`,username:'haitham',month:pm,points:50,reason:`المدير المثالي — ${monthName(pm)}`});
  const star=activeEmps().find(e=>e.branch===B&&e.shift==='Night'&&e.dept==='قسم الكاشير')||activeEmps()[0];
  S.market=[{id:pm,month:pm,code:star.code,status:'listed',wish:{branch:null,shift:'Morning',note:'نفسي أجرب الصبح عشان الدراسة'},chosen:null,secret:'123456',created_at:new Date().toISOString()}];
  S.offers=[{id:pm+'|mahmoud',market_id:pm,username:'mahmoud',points:150,branch:B,shift:'Morning',note:'مكانك محجوز عندنا'},{id:pm+'|haitham',market_id:pm,username:'haitham',points:90,branch:B,shift:'Morning',note:'تعالى معانا وهتلاقي فرصتك'}];
  // employee votes for the best manager
  S.votes=[];const vm=monthOf(ymd(new Date()));for(const e of activeEmps()){if(rnd()<.45)continue;const L=S.users.filter(u=>u.role!=='ops'&&(!u.branch||u.branch===e.branch)&&u.emp_code!==e.code);if(L.length)S.votes.push({month:vm,voter:e.code,device:'demo-'+e.code,manager:(rnd()<.45?L[0]:pick(L)).username});}
  const t=activeEmps().find(e=>e.branch===B&&e.dept==='قسم البقاله');if(t)t.title='أسطوري';
  RANK_CACHE=null;SALES_CACHE={};
}

// ---------- 🗳️ تصويت الموظفين لأحسن مدير ----------
function deviceId(){try{let d=localStorage.getItem('najm-device');if(!d){d=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)+Math.random().toString(36).slice(2));localStorage.setItem('najm-device',d);}return d;}catch(e){return 'nostore-'+Math.random().toString(36).slice(2)+Date.now().toString(36);}}
let VOTER=null;
function vVote(){
  const m=monthOf(ymd(new Date()));let done=null;try{done=localStorage.getItem('najm-voted-'+m);}catch(e){}
  if(done)return `<div class="card" style="max-width:520px;margin:20px auto;text-align:center"><div style="font-size:56px">🗳️</div><h2>صوتك اتسجل لشهر ${monthName(m)}</h2><div class="muted">شكراً — التصويت مرة واحدة في الشهر من كل موبايل.</div></div>`;
  if(!VOTER)return `<div class="card" style="max-width:520px;margin:20px auto"><h2>🗳️ صوّت لأحسن مدير — ${monthName(m)}</h2><div class="muted" style="margin-bottom:10px">صوتك سري، وبيمثل ${MGR_W().votes}% من جايزة المدير المثالي. صوت واحد في الشهر لكل موظف ولكل موبايل.</div>
    <label>كودك الوظيفي<br><input class="inp" id="v_code" inputmode="numeric" style="width:100%;font-size:20px" value="${esc(ME||'')}" onkeydown="if(event.key==='Enter')voteStart()"></label>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="voteStart()">التالي</button></div></div>`;
  const e=emp(VOTER);const L=managers().filter(u=>(!u.branch||u.branch===e.branch)&&u.emp_code!==e.code);
  return `<div class="card" style="max-width:720px;margin:20px auto"><h2>🗳️ ${esc(e.name)} — مين أحسن مدير في ${esc(e.branch)} الشهر ده؟</h2><div class="muted" style="margin-bottom:10px">اختار واحد بس — مش هتقدر تغيّر بعد التأكيد.</div>
    <div class="grid g-3">${L.map(u=>{const me=mgrEmp(u);return `<button class="card" style="cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="voteFor('${esc(u.username)}')">${me?ava(me,'xl'):`<div class="ava xl">${esc(u.name[0])}</div>`}<b>${esc(u.name)}</b><span class="small muted">${ROLES[u.role]}${u.shift?' · '+esc(u.shift):''}</span></button>`;}).join('')||'<div class="empty">مفيش مديرين في فرعك لسه</div>'}</div>
    <div class="row" style="margin-top:12px"><button class="btn sm" onclick="VOTER=null;render()">رجوع</button></div></div>`;
}
function voteStart(){const c=$('#v_code').value.trim();const e=emp(c);if(!e||!e.active){toast('الكود ده مش موجود');return;}VOTER=c;render();}
async function voteFor(un){
  const u=managers().find(x=>x.username===un);if(!await askConfirm(`تأكيد صوتك لـ «${u.name}»؟`))return;
  const m=monthOf(ymd(new Date()));let r;
  if(LIVE){try{r=await sbRpc('najm_vote',{p_code:VOTER,p_device:deviceId(),p_manager:un});}catch(e){toast('⚠️ '+e.message);return;}}
  else{S.votes=S.votes||[];const dev=deviceId();if(S.votes.some(v=>v.month===m&&v.voter===VOTER))r={ok:false,error:'voted'};else if(S.votes.some(v=>v.month===m&&v.device===dev))r={ok:false,error:'device_used'};else{S.votes.push({month:m,voter:VOTER,device:dev,manager:un});r={ok:true};save();}}
  if(!r?.ok){toast({voted:'الكود ده صوّت قبل كده الشهر ده',device_used:'الموبايل ده اتصوّت منه قبل كده الشهر ده',self:'مينفعش تصوّت لنفسك',code:'الكود مش موجود',manager:'المدير ده مش في فرعك'}[r?.error]||'ماتسجلش');return;}
  try{localStorage.setItem('najm-voted-'+m,'1');}catch(e){}
  VOTER=null;RANK_CACHE=null;if(LIVE)await refresh(true);render();toast('🗳️ صوتك اتسجل — شكراً');
}

// ---------- login / modal ----------
async function openLogin(){
  if(USER){if(await askConfirm('تسجيل خروج؟')){USER=null;PIN=null;try{sessionStorage.removeItem('najm-user')}catch(e){}if(LIVE)await refresh();render();}return;}
  openModal(`<button class="x" onclick="closeModal()">✕</button><div class="login"><h2>🔐 دخول المديرين</h2>
    <label>اسم الدخول<br><input class="inp" id="l_user" style="width:100%" autocomplete="username"></label><br><br>
    <label>الرقم السري<br><input class="inp" id="l_pin" type="password" inputmode="numeric" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()"></label>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="doLogin()">دخول</button></div>
    <div class="small muted" style="margin-top:10px">الموظفين مش محتاجين دخول.</div></div>`);
  setTimeout(()=>$('#l_user')?.focus(),50);
}
async function doLogin(){
  const un=$('#l_user').value.trim().toLowerCase(),pin=$('#l_pin').value;
  let u;
  if(LIVE){try{u=await sbRpc('najm_login',{p_user:un,p_pin:pin});}catch(e){toast('⚠️ مش قادر أوصل لقاعدة البيانات');return;}PIN=pin;}
  else u=S.users.find(x=>x.username===un&&x.pin===pin&&x.active!==false);
  if(!u){PIN=null;toast('اسم الدخول أو الرقم السري غلط — بعد 5 محاولات غلط الحساب بيتقفل 15 دقيقة');return;}
  USER={username:u.username,name:u.name,role:u.role,branch:u.branch||'',shift:u.shift||'',depts:u.depts||[]};
  try{sessionStorage.setItem('najm-user',JSON.stringify({...USER,pin:LIVE?PIN:undefined}))}catch(e){}
  F.branch=USER.branch||'';closeModal();VIEW=USER.role==='ops'?'dash':'rate';
  if(LIVE){toast('⏳ بنحمّل بيانات فريقك…');await refresh();await seedEmployeesIfEmpty();}
  render();toast('أهلاً '+u.name);
}
function openModal(h){$('#modal').innerHTML=h;$('#modalBg').classList.add('open');if(IMP&&$('#impPrev'))previewImp();}
function closeModal(){$('#modalBg').classList.remove('open');IMP=null;}

(async()=>{
  if(DEMO){demoSeed();}else await load();
  let saved=null;try{saved=JSON.parse(sessionStorage.getItem('najm-user')||'null');}catch(e){}
  const TVQ=new URLSearchParams(location.search).get('tv');
  if(TVQ!==null){saved=null;tvInit(TVQ);}
  const dp=$('#dayPick');dp.value=DATE;dp.onchange=()=>{if(dp.value){DATE=dp.value;RANK_CACHE=null;LIVE?refresh():render();}};
  render();
  if(DEMO){LIVE=false;const f=$('#demoFlag');f.innerHTML='🧪 نسخة تجريبية بأرقام وهمية — مفيش حاجة بتتحفظ · التشغيل <b>ops / 0000</b> · مدير البيطاش <b>haitham / 1111</b> · الهايجين <b>yasser / 7777</b> · مدير الصبح <b>mahmoud / 2222</b> · مدير الليل <b>islam / 3333</b> · كود اللاعب في السوق <b>123456</b>';render();if(TVB){TV_READY=true;}return;}
  try{
    if(saved?.pin){const u=await sbRpc('najm_login',{p_user:saved.username,p_pin:saved.pin});if(u){USER={username:u.username,name:u.name,role:u.role,branch:u.branch||'',shift:u.shift||'',depts:u.depts||[]};PIN=saved.pin;}}
    await pull();LIVE=true;
  }catch(e){LIVE=false;if(saved&&!saved.pin&&S.users.some(x=>x.username===saved.username))USER=saved;}
  liveFlag();render();
  if(TVB){TV_READY=true;tvCelebrateCheck();}
  setInterval(()=>{if(document.visibilityState==='visible')refresh(true);},60000);
})();
</script>
