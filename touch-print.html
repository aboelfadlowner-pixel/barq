<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --primary:#1a3a2a;--accent:#2d8653;--bg:#f4f6f4;--card:#fff;
  --text:#1a2e1a;--muted:#6b8f71;--border:#d4e4d8;--red:#c0392b;
}
html,body{height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden}
button,input{font-family:'Cairo',sans-serif}

.header{background:var(--primary);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.header .logo{font-size:19px;font-weight:900}
.header .logo span{font-size:12px;font-weight:400;opacity:.8;margin-right:8px}

.toolbar{padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:39}
.toolbar input[type=text]{flex:1;min-width:180px;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:16px;background:#fafffb}
.toolbar input[type=text]:focus{outline:none;border-color:var(--accent)}
.toolbar .status{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{padding:11px 16px;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer}
.btn-ghost{background:#fff;border:2px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff}

.empty-hint{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:16px}

.tile{
  position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;
  cursor:pointer;transition:transform .08s ease, box-shadow .12s ease;
  box-shadow:0 1px 2px rgba(26,58,42,.06);
}
.tile:active{transform:scale(.96);box-shadow:0 0 0 3px rgba(45,134,83,.25)}
.tile .icon{
  width:92px;height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:42px;margin-bottom:8px;color:#fff;position:relative;overflow:hidden;
}
.tile .icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.tile .tname{
  font-size:12.5px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;color:var(--text);
}
.tile .tprice{font-size:12px;font-weight:900;color:var(--accent);margin-top:4px}
.tile .plus{
  position:absolute;bottom:-8px;left:-8px;width:34px;height:34px;border-radius:50%;
  background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.25);border:3px solid var(--bg);
  cursor:pointer;
}
.tile .plus:active{transform:scale(.9)}
.tile .bag{
  position:absolute;bottom:-8px;right:-8px;width:34px;height:34px;border-radius:50%;
  background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.25);border:3px solid var(--bg);
  cursor:pointer;
}
.tile .bag:active{transform:scale(.9)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:340px;text-align:center}
.modal .mname{font-size:15px;font-weight:800;color:var(--primary);margin-bottom:14px;min-height:2.6em}
.modal .qdisplay{font-size:40px;font-weight:900;color:var(--text);background:var(--bg);border-radius:12px;padding:10px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.keypad button{
  padding:16px 0;font-size:20px;font-weight:800;border:2px solid var(--border);border-radius:12px;
  background:#fafffb;cursor:pointer;color:var(--text)
}
.keypad button:active{background:var(--card-2,#eef6f0)}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer}
.modal-cancel{background:#fff;border:2px solid var(--border)!important;color:var(--text)}
.modal-print{background:var(--accent);color:#fff}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.cattabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border)}
.tab{flex:none;padding:9px 14px;border-radius:20px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer;color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-add{background:var(--bg);color:var(--accent);border-style:dashed}
.catlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:50vh;overflow-y:auto}
.catopt{padding:13px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:14px;font-weight:800;cursor:pointer;text-align:center;color:var(--text)}
.catopt:active{background:var(--bg)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ برق</div>
  <div style="font-size:11px;opacity:.7">إصدار v12</div>
</div>

<div class="toolbar">
  <label class="btn btn-ghost" style="display:inline-block">
    📂 رفع شيت المنتجات
    <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="handleImport(event)">
  </label>
  <select id="deptSelect" onchange="onDeptSelectChange()" style="padding:11px 10px;border:2px solid var(--border);border-radius:10px;font-size:13px;font-weight:800;background:#fff">
    <option value="">🥐 كل الأقسام (اختار قسم المخبوزات)</option>
  </select>
  <label class="btn btn-ghost" style="display:inline-block">
    🥐 إضافة أصناف لقائمة المخبوزات
    <input type="file" id="bakeryFileInput" accept=".csv" style="display:none" onchange="handleBakeryUpload(event)">
  </label>

function seedDefaultCategories(){
  if (!PRODUCTS.length) return; // لسه معملناش أول رفع شيت، أجّل التصنيف التلقائي لحد ما يبقى فيه أصناف نطابقها

  localStorage.setItem(LS_SEEDED, '1');
  var freshId = 'cat_freshat';
  CATEGORIES.push({ id: freshId, name: 'فريشات' });
  var rules = [
    function(n){ return n.indexOf('باتيه') !== -1 && n.indexOf('فريش') !== -1; },
    function(n){ return n.indexOf('كرواسون') !== -1 && n.indexOf('ساده') !== -1; },
    function(n){ return n.indexOf('بان سويس') !== -1 || (n.indexOf('بان') !== -1 && n.indexOf('سويس') !== -1); },
    function(n){ return n.indexOf('مناقيش') !== -1; },
    function(n){ return n.indexOf('سندوتش') !== -1 && n.indexOf('جبن') !== -1; },
    function(n){ return n.indexOf('سينابون') !== -1; }
  ];
  PRODUCTS.forEach(function(p){
    var n = String(p.name || '').toLowerCase();
    var matched = rules.some(function(r){ return r(n); });
    if (matched) {
      var key = p.barcode || p.sku;
      if (key) PRODCATS[key] = freshId;
    }
  });

  savePRODCATS();
}

function todayStr(){
  var d = new Date();
  // يوم+شهر بدون سنة وبدون فواصل (زي 2709) عشان يبقى كود مش تاريخ واضح للعميل
  return String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0');
}

// سطر التاريخ المطبوع على الليبل: تاريخ الإنتاج (يوم+شهر بدون فواصل) + وقت الطباعة (ساعة:دقيقة) + تاريخ الانتهاء
// (+3 أيام). التلاتة بياخدوا من نفس لحظة الطباعة بالظبط (نفس new Date() مرة واحدة) عشان يكونوا متسقين مع بعض.
function buildPrintDateLine(){
  var d = new Date();
  var prodDate = String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0');
  var timeStr = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  var exp = new Date(d.getTime());
  exp.setDate(exp.getDate() + 3);
  var expDate = String(exp.getDate()).padStart(2,'0') + String(exp.getMonth()+1).padStart(2,'0');
  return prodDate + '   ' + timeStr + '   ' + expDate;
}

function cleanBarcodeValue(v){
  var arabicDigits = '٠١٢٣٤٥٦٧٨٩';
  var persianDigits = '۰۱۲۳۴۵۶۷۸۹';
  return String(v == null ? '' : v)
    .replace(/[​-‏‪-‮﻿]/g, '')
    .replace(/[٠-٩]/g, function(d){ return String(arabicDigits.indexOf(d)); })
    .replace(/[۰-۹]/g, function(d){ return String(persianDigits.indexOf(d)); })
    .trim();
}
function isValidBarcodeText(v){
  return /^[\x20-\x7E]+$/.test(String(v || ''));
}
function pick(row, keys){
  for (var k in row) {
    var kk = k.trim().toLowerCase();
    if (keys.indexOf(kk) !== -1 || keys.indexOf(k.trim()) !== -1) return row[k];
  }
  return '';
}
function isSoldByWeight(row){
  var v = pick(row, ['is_sold_by_weight']);
  if (v === '' || v === undefined || v === null) return false;
  var s = String(v).trim().toLowerCase();
  return s === '1' || s === 'true' || s === 'yes' || s === 'y';
}

function parseCSV(text){
  var lines = text.replace(/^﻿/, '').split(/\r\n|\n|\r/).filter(function(l){ return l.trim().length; });
  if (!lines.length) return [];
  var headers = splitCSVLine(lines[0]);
  return lines.slice(1).map(function(line){
    var cells = splitCSVLine(line);
    var row = {};
    headers.forEach(function(h, i){ row[h] = (cells[i] || '').trim(); });
    return row;
  });
}
// بارسر CSV بسيط بيتعامل مع القيم المتلفة بعلامات اقتباس (فيها فواصل جوه الاسم مثلاً)
function splitCSVLine(line){
  var out = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; } else { inQ = false; }
      } else { cur += c; }
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function ingestRows(rows){
  var seen = {}, list = [], skippedWeight = 0, skippedNoCode = 0;
  rows.forEach(function(row){
    if (isSoldByWeight(row)) { skippedWeight++; return; }
    var name = pick(row, ['name','اسم','الصنف']);
    var sku = cleanBarcodeValue(pick(row, ['sku']));
    var barcode = cleanBarcodeValue(pick(row, ['barcode','باركود','bc']));
    if (!isValidBarcodeText(barcode)) barcode = '';
    if (!isValidBarcodeText(sku)) sku = '';
    var price = parseFloat(cleanBarcodeValue(pick(row, ['price','سعر','السعر']))) || 0;
    var key = barcode || sku;
    if (!key) { skippedNoCode++; return; }
    if (seen[key]) return;
    seen[key] = true;
    list.push({ name: name || key, barcode: barcode, sku: sku, price: price });
  });
  PRODUCTS = list;
  localStorage.setItem(LS_KEY, JSON.stringify(PRODUCTS));
  seedDefaultCategories();
  renderTabs();
  renderGrid();
  var extra = [];
  if (skippedWeight) extra.push('استبعدنا ' + skippedWeight + ' صنف بالوزن');
  if (skippedNoCode) extra.push('استبعدنا ' + skippedNoCode + ' بدون كود');
  toast('✅ اتحمل ' + list.length + ' صنف' + (extra.length ? (' (' + extra.join(' — ') + ')') : ''));
}

function handleImport(evt){
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){ ingestRows(parseCSV(e.target.result)); };
  reader.readAsText(file, 'UTF-8');
  evt.target.value = '';
}

function loadBakerySkuSet(){

function mergeBakerySkusFromRows(rows){

  });

  return { added: added, total: set.size };

async function fetchAllPaged(query){
  var all = [], offset = 0, batchSize = 1000;
  while (true) {
    var r = await fetch(SB_URL + '/rest/v1/' + query + (query.indexOf('?') === -1 ? '?' : '&') + 'limit=' + batchSize + '&offset=' + offset, { headers: SB_HEADERS });
    if (!r.ok) throw new Error(r.statusText);
    var batch = await r.json();
    if (!batch || !batch.length) break;
    all = all.concat(batch);
    if (batch.length < batchSize) break;
    offset += batchSize;
  }
  return all;
}

  if (dept) parts.push('قسم: ' + dept);
  if (skuCount > DEFAULT_BAKERY_SKUS.length) parts.push((skuCount - DEFAULT_BAKERY_SKUS.length) + ' كود إضافي مُضاف يدوي');
  el.textContent = '🥐 الفلتر فعّال — ' + parts.join(' + ');

  names.forEach(function(n){

var RAW_PRODUCTS_CACHE = []; // آخر نتيجة خام من products_master قبل فلترة القسم

function applyDeptFilterAndRender(){
  var dept = localStorage.getItem(LS_DEPT);
  var bakerySkus = loadBakerySkuSet();
  var filterActive = !!dept || bakerySkus.size > 0;
  var seen = {}, list = [];
  RAW_PRODUCTS_CACHE.forEach(function(row){
    if (filterActive) {
      var inDept = dept && DEPARTMENTS[row.sku] === dept;
      var inList = bakerySkus.has(String(row.sku || '').trim().toLowerCase());
      if (!inDept && !inList) return;
    }
    var barcode = cleanBarcodeValue(row.barcode || '');
    var sku = cleanBarcodeValue(row.sku || '');
    if (!isValidBarcodeText(barcode)) barcode = '';
    if (!isValidBarcodeText(sku)) sku = '';
    var key = barcode || sku;
    if (!key || seen[key]) return;
    seen[key] = true;
    list.push({ name: row.name || key, barcode: barcode, sku: sku, price: parseFloat(row.price) || 0 });
  });
  if (!list.length) return;
  PRODUCTS = list;
  localStorage.setItem(LS_KEY, JSON.stringify(PRODUCTS));
  seedDefaultCategories();
  renderTabs();
  renderGrid();
  toast('✅ اتحدّث (' + list.length + ' صنف)');
}

async function loadFromSupabaseAuto(){
  try {
    var depts = await fetchAllPaged('sku_departments?select=sku,department&order=sku');
    DEPARTMENTS = {};
    depts.forEach(function(d){ DEPARTMENTS[d.sku] = d.department; });
    populateDeptSelect();

    var all = await fetchAllPaged('products_master?select=sku,name,barcode,price&order=name');
    if (!all.length) return;
    RAW_PRODUCTS_CACHE = all;
    applyDeptFilterAndRender();
  } catch(e) { /* offline or blocked — keep cached PRODUCTS from localStorage */ }
}

function hashStr(s){
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return h;
}

function renderGrid(){
  var wrap = document.getElementById('gridWrap');
  var statusEl = document.getElementById('statusText');
  statusEl.textContent = PRODUCTS.length ? ('متحمّل ' + PRODUCTS.length + ' صنف') : 'لسه مفيش شيت متحمل';

  if (!PRODUCTS.length) {
    wrap.innerHTML = '<div class="empty-hint">ارفع شيت المنتجات الأول من الزرار اللي فوق 📂</div>';
    return;
  }
  var q = document.getElementById('searchBox').value.trim().toLowerCase();
  var list = PRODUCTS.filter(function(p){
    var key = p.barcode || p.sku;
    var cat = PRODCATS[key] || null;
    if (cat !== ACTIVE_CAT) return false;
    if (!q) return true;
    return p.name.toLowerCase().indexOf(q) !== -1 ||
           (p.barcode||'').indexOf(q) !== -1 || (p.sku||'').toLowerCase().indexOf(q) !== -1;
  });
  if (!list.length) {
    wrap.innerHTML = '<div class="empty-hint">مفيش أصناف هنا. دوس دوسة مطولة على أي صنف في تصنيف تاني علشان تنقله هنا</div>';
    return;
  }

  var html = '<div class="grid">';
  list.forEach(function(p, i){
    var h = hashStr(p.barcode || p.sku || p.name);
    var color = ICON_COLORS[h % ICON_COLORS.length];
    var emoji = ICON_EMOJIS[h % ICON_EMOJIS.length];
    var idx = PRODUCTS.indexOf(p);
    var sku = (p.sku||'').trim();
    var photoSrc = sku ? (PRODUCT_PHOTOS[sku] || (PRODUCT_IMAGE_BASE + encodeURIComponent(sku) + '.jpg')) : '';
    var imgTag = photoSrc ? '<img src="' + photoSrc + '" loading="lazy" alt="" onerror="this.style.display=\'none\'">' : '';
    html +=
      '<div class="tile" onpointerdown="tileDown(' + idx + ')" onpointerup="tileUp(' + idx + ')" onpointercancel="tileCancel()" onpointerleave="tileCancel()">' +
        '<div class="icon" style="background:' + color + '">' + emoji + imgTag + '</div>' +
        '<div class="tname">' + escapeHtml(p.name) + '</div>' +
        '<div class="tprice">' + p.price.toFixed(2) + ' ج.م</div>' +
        '<div class="plus" onpointerdown="event.stopPropagation()" onpointerup="event.stopPropagation()" onclick="event.stopPropagation();openQtyModal(' + idx + ')">+</div>' +
        '<div class="bag" onpointerdown="event.stopPropagation()" onpointerup="event.stopPropagation()" onclick="event.stopPropagation();openBagQtyModal(' + idx + ')">📦</div>' +
      '</div>';
  });
  html += '</div>';
  wrap.innerHTML = html;
}

// دوسة عادية = طباعة فورية | دوسة مطولة (نص ثانية) = قائمة نقل/تصنيف
var LP_TIMER = null, LP_FIRED = false;
function tileDown(idx){
  LP_FIRED = false;
  clearTimeout(LP_TIMER);
  LP_TIMER = setTimeout(function(){
    LP_FIRED = true;
    if (navigator.vibrate) navigator.vibrate(30);
    openCatMenu(idx);
  }, 550);
}
function tileUp(idx){
  clearTimeout(LP_TIMER);
  if (!LP_FIRED) printOne(idx);
}
function tileCancel(){
  clearTimeout(LP_TIMER);
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function printOne(idx){
  var p = PRODUCTS[idx];
  if (!p) return;
  printLabels(p, 1);
}

var QTY_TARGET = null;
var QTY_VALUE = '1';
var QTY_FRESH = true; // true = لسه محدش دوس رقم، أول دوسة هتمسح الـ1 الافتراضي
var QTY_MODE = 'multi'; // 'multi' = عدة ليبلات منفصلة | 'bag' = ليبل واحد عليه بادچ عدد

function openQtyModal(idx){
  QTY_TARGET = idx;
  QTY_VALUE = '1';
  QTY_FRESH = true;
  QTY_MODE = 'multi';
  var p = PRODUCTS[idx];
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'qtyModal';
  backdrop.innerHTML =
    '<div class="modal">' +
      '<div class="mname">' + escapeHtml(p.name) + '<br><span style="font-weight:400;font-size:12px;color:var(--muted)">عدد الليبلات المنفصلة</span></div>' +
      '<div class="qdisplay" id="qtyDisplay">1</div>' +
      '<div class="keypad">' +
        [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button onclick="qtyPress(\'' + n + '\')">' + n + '</button>'; }).join('') +
        '<button onclick="qtyClear()">⟲</button>' +
        '<button onclick="qtyPress(\'0\')">0</button>' +
        '<button onclick="qtyBackspace()">⌫</button>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="modal-cancel" onclick="closeQtyModal()">إلغاء</button>' +
        '<button class="modal-print" onclick="confirmQtyPrint()">🖨️ طباعة</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);
}

var LS_SCANCODE = 'barq_touch_scancode_v1';
function loadScanCodeMap(){
  try { return JSON.parse(localStorage.getItem(LS_SCANCODE) || '{}'); } catch(e){ return {}; }
}
function saveScanCode(key, code){
  var m = loadScanCodeMap();
  m[key] = code;
  localStorage.setItem(LS_SCANCODE, JSON.stringify(m));
}
// الباركود المستخدم في التشفير = باركود المنتج زي ما هو بالظبط في فوديكس (بدون أي تعديل أو قص) —
// اتأكدت عمليًا إن فوديكس بيدور على المنتج بمطابقة الكود ده كامل من أول رقم في السكان
function guessScanCode(p){
  var m = loadScanCodeMap();
  var key = p.barcode || p.sku;
  if (m[key]) return m[key];
  return String(p.barcode || p.sku || '').replace(/\D/g, '');
}
// لو كود اتحفظ غلط قبل كده (زي رقم ناقص)، الزرار ده بيرجّع باركود الصنف زي ما هو مسجل في قاعدة البيانات بالظبط
function resetBagPluToOriginal(idx){
  var p = PRODUCTS[idx];
  if (!p) return;
  var original = String(p.barcode || p.sku || '').replace(/\D/g, '');
  var input = document.getElementById('bagPluInput');
  if (input) input.value = original;
}

function openBagQtyModal(idx){
  QTY_TARGET = idx;
  QTY_VALUE = '1';
  QTY_FRESH = true;
  QTY_MODE = 'bag';
  var p = PRODUCTS[idx];
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'qtyModal';
  backdrop.innerHTML =
    '<div class="modal">' +
      '<div class="mname">' + escapeHtml(p.name) + '<br><span style="font-weight:400;font-size:12px;color:var(--muted)">📦 عدد القطع جوه الكيس (ليبل واحد بس هيتطبع)</span></div>' +
      '<div class="qdisplay" id="qtyDisplay">1</div>' +
      '<div class="keypad">' +
        [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button onclick="qtyPress(\'' + n + '\')">' + n + '</button>'; }).join('') +
        '<button onclick="qtyClear()">⟲</button>' +
        '<button onclick="qtyPress(\'0\')">0</button>' +
        '<button onclick="qtyBackspace()">⌫</button>' +
      '</div>' +
      '<div style="text-align:right;margin-bottom:14px">' +
        '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px">🔁 باركود الصنف في فوديكس (زي ما هو بالظبط — هيترمز فيه العدد تلقائي عشان السكان يحسب الإجمالي)</div>' +
        '<input type="text" id="bagPluInput" placeholder="باركود الصنف في فوديكس" inputmode="numeric" value="' + escapeHtml(guessScanCode(p)) + '" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px;text-align:center;font-family:inherit">' +
        '<div style="font-size:11px;color:var(--muted);margin-top:5px">⚠️ لازم يكون نفس باركود الصنف المسجل في فوديكس بالظبط رقم برقم — أي فرق (حتى صفر ناقص) هيخلي السكان يطلّع صنف تاني غلط</div>' +
        '<button type="button" onclick="resetBagPluToOriginal(' + idx + ')" style="margin-top:6px;background:none;border:1px dashed var(--border);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--muted);cursor:pointer">↺ استرجاع الباركود الأصلي للصنف</button>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="modal-cancel" onclick="closeQtyModal()">إلغاء</button>' +
        '<button class="modal-print" onclick="confirmQtyPrint()">🖨️ طباعة</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);
}

function qtyPress(d){
  QTY_VALUE = QTY_FRESH ? d : QTY_VALUE + d;
  QTY_FRESH = false;
  if (QTY_VALUE.length > 3) QTY_VALUE = QTY_VALUE.slice(0, 3);
  document.getElementById('qtyDisplay').textContent = String(parseInt(QTY_VALUE) || 0);
}
function qtyBackspace(){
  QTY_VALUE = QTY_VALUE.slice(0, -1);
  if (!QTY_VALUE) QTY_VALUE = '0';
  QTY_FRESH = false;
  document.getElementById('qtyDisplay').textContent = QTY_VALUE;
}
function qtyClear(){
  QTY_VALUE = '0';
  QTY_FRESH = false;
  document.getElementById('qtyDisplay').textContent = '0';
}
function closeQtyModal(){
  var m = document.getElementById('qtyModal');
  if (m) m.remove();
  QTY_TARGET = null;
}
function confirmQtyPrint(){
  var qty = parseInt(QTY_VALUE) || 0;
  if (qty < 1) { toast('⚠️ اكتب عدد صحيح'); return; }
  var p = PRODUCTS[QTY_TARGET];
  var mode = QTY_MODE;
  var autoScanPlu = null;
  if (mode === 'bag') {
    var pluInput = document.getElementById('bagPluInput');
    var plu = (pluInput && pluInput.value || '').trim();
    if (!plu) { toast('⚠️ اكتب باركود الصنف في فوديكس'); return; }
    autoScanPlu = plu;
    if (p) saveScanCode(p.barcode || p.sku, plu);
  }
  closeQtyModal();
  if (!p) return;
  if (mode === 'bag') printBagLabel(p, qty, autoScanPlu);
  else printLabels(p, qty);
}

function buildLabelHTML(p, date, badgeHtml){
  return (
    '<div class="label">' +
      badgeHtml +
      '<img class="llogo" src="' + LOGO_DATA_URI + '" alt="">' +
      '<div class="lname">' + escapeHtml(p.name) + '</div>' +
      '<div class="ldate">' + date + '</div>' +
      '<svg class="barcode" jsbarcode-value="' + escapeHtml(p.barcode || p.sku) + '" jsbarcode-format="CODE128" jsbarcode-width="2" jsbarcode-height="40" jsbarcode-displayvalue="true" jsbarcode-fontsize="9" jsbarcode-margin="0"></svg>' +
      '<div class="lprice">' + p.price.toFixed(2) + ' ج.م</div>' +
    '</div>'
  );
}

  var old = document.getElementById('printFrame');
  if (old) old.remove();
  var iframe = document.createElement('iframe');
  iframe.id = 'printFrame';

  document.body.appendChild(iframe);
  var win = iframe.contentWindow;
  win.document.open();
  win.document.write(
    '<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>طباعة الباركود</title>' +

    '.llogo{height:9mm;width:auto;margin-bottom:0.5mm}' +

    '.ldate{font-size:2mm;color:#444}' +
    '.lprice{font-size:7.2mm;font-weight:900}' +

    '.qtybadge{position:absolute;top:0.6mm;right:0.6mm;background:#1a1a1a;color:#fff;font-weight:900;font-size:5.5mm;line-height:1;padding:0.8mm 1.6mm;border-radius:1.2mm;min-width:8mm;text-align:center}' +
    '.qtybadge .x{font-size:3mm;opacity:.85;margin-left:0.5mm}' +
    '</style></head><body>' +
    labelsHTML +
    '<scr' + 'ipt>' +
    'window.onload=function(){' +
      'document.querySelectorAll("svg.barcode").forEach(function(el){' +
        'var bcVal = el.getAttribute("jsbarcode-value");' +
        'var opts = {' +
          'width: parseFloat(el.getAttribute("jsbarcode-width")), ' +
          'height: parseFloat(el.getAttribute("jsbarcode-height")), ' +
          'displayValue: el.getAttribute("jsbarcode-displayvalue") === "true", ' +

          'margin: parseFloat(el.getAttribute("jsbarcode-margin"))' +

        'try{JsBarcode(el, bcVal, Object.assign({format: el.getAttribute("jsbarcode-format")}, opts));}' +
        'catch(e){' +
          'try{JsBarcode(el, bcVal, Object.assign({format:"CODE128"}, opts));}' +
          'catch(e2){el.outerHTML="<div style=\\"color:red;font-size:8px\\">تعذّر رسم الباركود: "+String(e2).replace(/</g,"&lt;")+"</div>";}' +
        '}' +
      '});' +
      'setTimeout(function(){window.print();}, 200);' +
      'window.onafterprint=function(){' +
        'setTimeout(function(){ var f=parent.document.getElementById("printFrame"); if(f) f.remove(); }, 300);' +
      '};' +
    '};' +
    '</scr' + 'ipt>' +
    '</body></html>'
  );
  win.document.close();
  toast(toastMsg);
}

function printLabels(p, qty){
  var dims = { w: 55, h: 40 };
  var date = buildPrintDateLine();
  var labelsHTML = '';
  for (var i = 0; i < qty; i++) {
    labelsHTML += buildLabelHTML(p, date, '');
  }
  openPrintWindow(dims, labelsHTML, '🖨️ بيطبع ' + qty + ' ليبل: ' + p.name);
}

// EAN-13 مبني بنفس تقنية "الباركود اللي بيرمز الوزن" المستخدمة أصلاً للمنتجات المباعة بالوزن،
// بس هنا بنحط عدد القطع بدل الوزن (كإنه "كيلوجرامات" وهمية) عشان فوديكس يحسب الإجمالي تلقائي عند السكان.
// الشرط: الصنف لازم يكون معمول "يُباع بالوزن" في فوديكس، وسعر الكيلو = سعر القطعة الواحدة بالظبط.
// رقم التحقق: مجموع مرجّح للأرقام (وزن 1 للخانة الأولى/الثالثة/...، ووزن 3 للخانة التانية/الرابعة/...)
// بيشتغل على أي طول كود — اتأكد عمليًا على فوديكس إن الصيغة دي هي الصح: كود الصنف زي ما هو + 5 أرقام وزن بالجرام + رقم التحقق ده
function genericCheckDigit(body){
  var sum = 0;
  for (var i = 0; i < body.length; i++) {
    var d = parseInt(body[i], 10) || 0;
    sum += (i % 2 === 0) ? d : d * 3;
  }
  return String((10 - (sum % 10)) % 10);
}
function buildWeightEncodedBarcode(productBarcode, qty){
  var codeDigits = String(productBarcode || '0').replace(/\D/g, '') || '0';
  var grams = Math.round(qty * 1000);
  var qtyPadded = String(grams).padStart(5, '0');
  var body = codeDigits + qtyPadded;
  return body + genericCheckDigit(body);
}

function printBagLabel(p, qty, autoScanPlu){
  var dims = { w: 55, h: 40 };
  var date = buildPrintDateLine();
  var badgeHtml = '<div class="qtybadge">' + qty + '<span class="x">×</span></div>';
  var labelProduct = p;
  var toastMsg = '🖨️ بيطبع ليبل كيس (×' + qty + '): ' + p.name;
  if (autoScanPlu) {
    var encoded = buildWeightEncodedBarcode(autoScanPlu, qty);
    labelProduct = Object.assign({}, p, { barcode: encoded, sku: '' });
    toastMsg = '🖨️ بيطبع ليبل بكود مُرمّز تلقائي (×' + qty + '): ' + p.name;
  }
  var labelsHTML = buildLabelHTML(labelProduct, date, badgeHtml);
  openPrintWindow(dims, labelsHTML, toastMsg);
}
