<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>أبو الفضل — طلبات الموقع</title>
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1d5e34;--brand-lt:#e8f3ec;--ink:#16261c;--muted:#5f7568;--line:#dde9e1;--bg:#f3f6f4;
  --new:#b42318;--new-lt:#fef3f2;--prep:#b54708;--prep-lt:#fffaeb;--out:#175cd3;--out-lt:#eff8ff;--done:#067647;--done-lt:#ecfdf3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10}
.hdr{max-width:1300px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hdr img{width:40px;height:40px;border-radius:50%;background:#fff}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sp{flex:1}
.hb{background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.live{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.live.off i{background:#f87171}
.bar{max-width:1300px;margin:auto;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab b{background:var(--new);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-inline-start:4px}
.bar select,.bar input{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.list{max-width:1300px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media(max-width:400px){.list{grid-template-columns:1fr}}
.o{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:5px solid var(--line);display:flex;flex-direction:column}
.o.s-new{border-top-color:var(--new)} .o.s-preparing{border-top-color:var(--prep)} .o.s-out_for_delivery,.o.s-ready{border-top-color:var(--out)}
.o.s-delivered{border-top-color:var(--done);opacity:.8} .o.s-cancelled{opacity:.6}
.oh{padding:12px 14px;display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line)}
.oh .no{font-size:22px;font-weight:800}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-new{background:var(--new-lt);color:var(--new)} .b-preparing{background:var(--prep-lt);color:var(--prep)}
.b-out_for_delivery,.b-ready{background:var(--out-lt);color:var(--out)} .b-delivered{background:var(--done-lt);color:var(--done)}
.b-cancelled{background:#f2f4f7;color:#667085}
.oh .when{margin-inline-start:auto;text-align:left;font-size:12px;color:var(--muted)}
.ob{padding:10px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.ob .k{color:var(--muted);font-size:12px;font-weight:700}
.ob a{color:var(--brand);font-weight:800;text-decoration:none}
.items{margin:6px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.it{display:flex;gap:8px;padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .q{font-weight:800;min-width:28px;color:var(--brand)}
.it .n{flex:1}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding-top:4px}
.note{background:#fffaeb;border-radius:8px;padding:6px 10px;font-size:13px}
.of{padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:auto}
.act{border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;background:var(--brand-lt);color:var(--brand)}
.act.main{background:var(--brand);color:#fff;flex:1}
.act.red{background:#fef3f2;color:var(--new)}
.act:disabled{opacity:.5}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:16px}
/* login + modal */
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:#fff;border-radius:16px;padding:24px;width:min(380px,100%);box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
.box img{width:80px;height:80px;border-radius:50%}
.box h2{margin:8px 0 16px}
.box input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:18px;text-align:center;letter-spacing:4px;margin-bottom:12px}
.btn{width:100%;background:var(--brand);color:#fff;border-radius:10px;padding:12px;font-weight:800;font-size:16px}
.err{color:var(--new);font-weight:700;margin-bottom:10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{text-align:start;max-height:90vh;overflow:auto;width:min(460px,100%)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;letter-spacing:0;text-align:start;margin:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:12px}
.chk input{width:20px;height:20px}
/* طباعة 80mm */
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;width:72mm;font-size:12px;color:#000}
  #print h3{text-align:center;font-size:16px}
  #print .r{display:flex;justify-content:space-between;gap:6px}
  #print hr{border:0;border-top:1px dashed #000;margin:4px 0}
  @page{size:80mm auto;margin:3mm}
}
</style>
</head>
<body>

<div id="login" class="center">
  <form class="box" id="loginForm">
    <img src="logo.jpg" alt="">
    <h2>طلبات الموقع</h2>
    <div class="err hidden" id="loginErr"></div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="رمز الدخول" required>
    <button class="btn" type="submit">دخول</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="hdr">
      <img src="logo.jpg" alt="">
      <h1>طلبات الموقع</h1>
      <span class="live" id="live"><i></i><span id="liveTxt">متصل</span></span>
      <span class="sp"></span>
      <button class="hb" id="soundBtn">🔔 الصوت: شغال</button>
      <button class="hb" id="settingsBtn">⚙️ الإعدادات</button>
      <button class="hb" id="logoutBtn">خروج</button>
    </div>
  </header>
  <div class="bar">
    <div id="tabs" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <span style="flex:1"></span>
    <select id="fBranch"><option value="">كل الفروع</option></select>
    <input id="fQ" placeholder="بحث: رقم/اسم/موبايل" style="width:180px">
  </div>
  <section class="list" id="list"></section>
</div>

<div id="print"></div>

<script>
'use strict';
const SB_URL = 'https://ojvbydnvywbsgyhqftap.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qdmJ5ZG52eXdic2d5aHFmdGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzODQyMDcsImV4cCI6MjA5Njk2MDIwN30.3UyyKGcmehGVxadPotOgwYF6CmDbkdb8gw7BFxlYFcU';
const POLL_MS = 20000;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (Math.round(Number(n) * 100) / 100).toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' ج.م';
const sleep = ms => new Promise(r => setTimeout(r, ms));

const STATUS = { new: 'جديد', preparing: 'جاري التجهيز', out_for_delivery: 'خرج للتوصيل', ready: 'جاهز للاستلام', delivered: 'تم التسليم', cancelled: 'ملغي' };
const NEXT = {
  delivery: { new: ['preparing', 'ابدأ التجهيز'], preparing: ['out_for_delivery', 'خرج للتوصيل'], out_for_delivery: ['delivered', 'تم التسليم'] },
  pickup: { new: ['preparing', 'ابدأ التجهيز'], preparing: ['ready', 'جاهز للاستلام'], ready: ['delivered', 'العميل استلم'] }
};
const TABS = [['active', 'الحالية'], ['new', 'جديد'], ['preparing', 'تجهيز'], ['out', 'توصيل/جاهز'], ['delivered', 'تم'], ['cancelled', 'ملغي'], ['all', 'الكل']];

let PIN = sessionStorage.getItem('af_admin_pin') || '';
let orders = [], tab = 'active', seen = new Set(JSON.parse(localStorage.getItem('af_admin_seen') || '[]')), sound = localStorage.getItem('af_admin_sound') !== '0';
let settings = null, firstLoad = true;

async function rpc(fn, body, retries = 2) {
  let last;
  for (let i = 0; i <= retries; i++) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
        method: 'POST', signal: ctl.signal,
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      clearTimeout(t);
      const j = await r.json().catch(() => null);
      if (r.ok) {
        if (j && j.ok === false) { const e = new Error(j.message || j.error); e.code = j.error === 'auth' ? 'auth' : j.error; e.status = 400; throw e; }
        return j;
      }
      const msg = (j && (j.message || j.hint)) || ('HTTP ' + r.status);
      const e = new Error(msg); e.status = r.status; e.code = j && j.code;
      if (r.status < 500) throw e;
      last = e;
    } catch (e) { clearTimeout(t); if (e.status && e.status < 500) throw e; last = e; }
    if (i < retries) await sleep(700 * 2 ** i);
  }
  throw last;
}
const isAuthErr = e => e && e.code === 'auth';

// ===== دخول =====
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  PIN = $('#pin').value.trim();
  $('#loginErr').classList.add('hidden');
  try { await load(); sessionStorage.setItem('af_admin_pin', PIN); showApp(); }
  catch (err) { $('#loginErr').textContent = isAuthErr(err) ? err.message : 'مش قادر يوصل للسيرفر'; $('#loginErr').classList.remove('hidden'); }
});
function showApp() { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); startPolling(); loadSettings(); unlockAudio(); }
$('#logoutBtn').onclick = () => { sessionStorage.removeItem('af_admin_pin'); location.reload(); };

// ===== تحميل الطلبات =====
async function load() {
  const since = new Date(Date.now() - 3 * 864e5).toISOString();
  const data = (await rpc('shop_admin_orders', { p_pin: PIN, p_since: since })).orders || [];
  const fresh = data.filter(o => o.status === 'new' && !seen.has(o.id));
  orders = data;
  if (!firstLoad && fresh.length) alertNew(fresh.length);
  fresh.forEach(o => seen.add(o.id));
  localStorage.setItem('af_admin_seen', JSON.stringify([...seen].slice(-500)));
  firstLoad = false;
  render();
}
let pollT;
function startPolling() {
  clearInterval(pollT);
  pollT = setInterval(async () => {
    try { await load(); setLive(true); }
    catch (e) { if (isAuthErr(e)) { sessionStorage.removeItem('af_admin_pin'); location.reload(); } setLive(false); }
  }, POLL_MS);
}
function setLive(ok) { $('#live').classList.toggle('off', !ok); $('#liveTxt').textContent = ok ? 'متصل — تحديث كل 20 ث' : 'النت فاصل… بيحاول تاني'; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && PIN) load().then(() => setLive(true), () => setLive(false)); });

// ===== تنبيه طلب جديد =====
let actx;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch { } }
function beep() {
  if (!sound || !actx) return;
  try {
    actx.resume();
    [0, .25, .5].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.25, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d + .2);
      o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .22);
    });
  } catch { }
}
let flashT;
function alertNew(n) {
  beep();
  clearInterval(flashT);
  let on = false;
  flashT = setInterval(() => { document.title = (on = !on) ? `🔴 (${n}) طلب جديد` : 'أبو الفضل — طلبات الموقع'; }, 900);
  setTimeout(() => { clearInterval(flashT); document.title = 'أبو الفضل — طلبات الموقع'; }, 30000);
  if ('Notification' in window && Notification.permission === 'granted') new Notification('طلب جديد من الموقع', { body: `${n} طلب جديد` });
}
$('#soundBtn').onclick = () => {
  sound = !sound; localStorage.setItem('af_admin_sound', sound ? '1' : '0');
  $('#soundBtn').textContent = '🔔 الصوت: ' + (sound ? 'شغال' : 'مقفول');
  unlockAudio(); if (sound) beep();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
};
$('#soundBtn').textContent = '🔔 الصوت: ' + (sound ? 'شغال' : 'مقفول');

// ===== العرض =====
function inTab(o) {
  if (tab === 'all') return true;
  if (tab === 'active') return ['new', 'preparing', 'out_for_delivery', 'ready'].includes(o.status);
  if (tab === 'out') return ['out_for_delivery', 'ready'].includes(o.status);
  return o.status === tab;
}
function render() {
  const br = $('#fBranch').value, q = $('#fQ').value.trim();
  const brs = [...new Set(orders.map(o => o.branch))];
  const cur = $('#fBranch').value;
  $('#fBranch').innerHTML = '<option value="">كل الفروع</option>' + brs.map(b => `<option ${b === cur ? 'selected' : ''}>${esc(b)}</option>`).join('');
  const nNew = orders.filter(o => o.status === 'new').length;
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}${k === 'new' && nNew ? `<b>${nNew}</b>` : ''}</button>`).join('');
  const list = orders.filter(o => inTab(o) && (!br || o.branch === br) &&
    (!q || String(o.order_no).includes(q) || o.phone.includes(q) || o.customer_name.includes(q)));
  $('#list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">مفيش طلبات هنا 👌</div>';
}
function card(o) {
  const nx = (NEXT[o.fulfillment] || NEXT.delivery)[o.status];
  const wa = '2' + o.phone;
  const t = new Date(o.created_at);
  const mins = Math.round((Date.now() - t) / 60000);
  return `<article class="o s-${o.status}">
    <div class="oh">
      <div><div class="no">#${o.order_no}</div><span class="badge b-${o.status}">${STATUS[o.status]}</span></div>
      <div class="when">${t.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}<br>${t.toLocaleDateString('ar-EG')}<br>${mins < 120 ? `من ${mins} دقيقة` : ''}</div>
    </div>
    <div class="ob">
      <div><span class="k">العميل:</span> <b>${esc(o.customer_name)}</b></div>
      <div><span class="k">موبايل:</span> <a href="tel:${esc(o.phone)}" dir="ltr">${esc(o.phone)}</a> • <a href="https://wa.me/${esc(wa)}?text=${encodeURIComponent('أهلاً ' + o.customer_name + '، بخصوص طلبك رقم ' + o.order_no + ' من أبو الفضل')}" target="_blank" rel="noopener">واتساب</a></div>
      <div><span class="k">${o.fulfillment === 'pickup' ? '🏪 استلام من:' : '🚚 توصيل — فرع:'}</span> ${esc(o.branch)}</div>
      ${o.address ? `<div><span class="k">العنوان:</span> ${esc(o.address)}</div>` : ''}
      ${o.notes ? `<div class="note">📝 ${esc(o.notes)}</div>` : ''}
      <div class="items">${(o.items || []).map(i => `<div class="it"><span class="q">${Number(i.qty)}×</span><span class="n">${esc(i.name)}</span><span>${money(i.line_total)}</span></div>`).join('')}</div>
      ${Number(o.delivery_fee) ? `<div style="display:flex;justify-content:space-between"><span class="k">توصيل</span><span>${money(o.delivery_fee)}</span></div>` : ''}
      <div class="tot"><span>الإجمالي (${o.items_count} صنف)</span><span>${money(o.total)}</span></div>
      ${o.staff_note ? `<div class="k">ملاحظة داخلية: ${esc(o.staff_note)}</div>` : ''}
    </div>
    <div class="of">
      ${nx ? `<button class="act main" data-set="${nx[0]}" data-id="${o.id}">${nx[1]} ←</button>` : ''}
      <button class="act" data-print="${o.id}">🖨️ طباعة</button>
      ${!['delivered', 'cancelled'].includes(o.status) ? `<button class="act red" data-set="cancelled" data-id="${o.id}">إلغاء</button>` : ''}
      ${o.status === 'cancelled' ? `<button class="act" data-set="new" data-id="${o.id}">استرجاع</button>` : ''}
    </div>
  </article>`;
}

async function setStatus(id, st, btn) {
  let note = null;
  if (st === 'cancelled') { note = prompt('سبب الإلغاء (يظهر للموظفين بس):', ''); if (note === null) return; }
  btn.disabled = true;
  try {
    await rpc('shop_admin_set_status', { p_pin: PIN, p_order_id: id, p_status: st, p_staff_note: note || null });
    const o = orders.find(x => x.id === id); if (o) { o.status = st; if (note) o.staff_note = note; }
    render(); load().catch(() => { });
  } catch (e) { alert('ماتحفظش: ' + e.message); btn.disabled = false; }
}

function printOrder(id) {
  const o = orders.find(x => x.id === id); if (!o) return;
  $('#print').innerHTML = `<h3>أبو الفضل</h3><div style="text-align:center">طلب أونلاين #${o.order_no}</div>
    <div style="text-align:center">${new Date(o.created_at).toLocaleString('ar-EG')}</div><hr>
    <div>العميل: ${esc(o.customer_name)}</div><div>موبايل: ${esc(o.phone)}</div>
    <div>${o.fulfillment === 'pickup' ? 'استلام من الفرع' : 'توصيل'} — ${esc(o.branch)}</div>
    ${o.address ? `<div>العنوان: ${esc(o.address)}</div>` : ''}${o.notes ? `<div>ملاحظات: ${esc(o.notes)}</div>` : ''}<hr>
    ${(o.items || []).map(i => `<div class="r"><span>${Number(i.qty)}× ${esc(i.name)}</span><span>${Number(i.line_total)}</span></div>`).join('')}<hr>
    <div class="r"><span>المنتجات</span><span>${Number(o.subtotal)}</span></div>
    ${Number(o.delivery_fee) ? `<div class="r"><span>التوصيل</span><span>${Number(o.delivery_fee)}</span></div>` : ''}
    <div class="r" style="font-weight:800;font-size:14px"><span>الإجمالي</span><span>${Number(o.total)} ج.م</span></div><hr>
    <div style="text-align:center">الدفع كاش عند الاستلام — شكراً لك</div>`;
  window.print();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; render(); }
  else if (b.dataset.set) setStatus(b.dataset.id, b.dataset.set, b);
  else if (b.dataset.print) printOrder(b.dataset.print);
});
$('#fBranch').onchange = render;
$('#fQ').oninput = render;

// ===== الإعدادات =====
async function loadSettings() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/shop_settings?id=eq.1&select=*`, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
    settings = (await r.json())[0];
  } catch { }
}
$('#settingsBtn').onclick = async () => {
  await loadSettings();
  const s = settings || {};
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<form class="box" id="sf">
    <h2>إعدادات المتجر</h2>
    <label class="chk"><input type="checkbox" name="store_open" ${s.store_open ? 'checked' : ''}> استقبال الطلبات شغال</label>
    <div class="f"><label>رسالة وقت الإيقاف</label><input name="closed_message" value="${esc(s.closed_message || '')}"></div>
    <div class="f"><label>سعر التوصيل (ج.م)</label><input name="delivery_fee" type="number" min="0" step="0.5" value="${esc(s.delivery_fee ?? 0)}"></div>
    <div class="f"><label>توصيل مجاني لو الطلب فوق (فاضي = لا)</label><input name="free_delivery_over" type="number" min="0" value="${esc(s.free_delivery_over ?? '')}"></div>
    <div class="f"><label>الحد الأدنى للطلب (ج.م)</label><input name="min_order" type="number" min="0" value="${esc(s.min_order ?? 0)}"></div>
    <div class="f"><label>رقم واتساب المتجر</label><input name="whatsapp" dir="ltr" value="${esc(s.whatsapp || '')}" placeholder="01xxxxxxxxx"></div>
    <div class="f"><label>رقم تليفون المتجر</label><input name="phone" dir="ltr" value="${esc(s.phone || '')}"></div>
    <div class="f"><label>مواعيد العمل</label><input name="hours" value="${esc(s.hours || '')}"></div>
    <hr style="margin:12px 0;border:0;border-top:1px solid var(--line)">
    <div class="f"><label>تغيير رمز الدخول (اختياري — 6 حروف/أرقام على الأقل)</label><input name="new_pin" type="password" autocomplete="new-password"></div>
    <div class="err hidden" id="sErr"></div>
    <div style="display:flex;gap:8px"><button class="btn" type="submit">حفظ</button><button class="btn" type="button" style="background:#eef2ef;color:var(--ink)" id="sCancel">إلغاء</button></div>
  </form>`;
  document.body.appendChild(m);
  m.querySelector('#sCancel').onclick = () => m.remove();
  m.querySelector('#sf').onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const payload = {
      store_open: ev.target.store_open.checked, closed_message: f.get('closed_message'),
      delivery_fee: Number(f.get('delivery_fee') || 0), free_delivery_over: f.get('free_delivery_over'),
      min_order: Number(f.get('min_order') || 0), whatsapp: f.get('whatsapp').trim(), phone: f.get('phone').trim(), hours: f.get('hours')
    };
    const err = m.querySelector('#sErr');
    try {
      await rpc('shop_admin_update_settings', { p_pin: PIN, p_settings: payload });
      const np = f.get('new_pin').trim();
      if (np) {
        await rpc('shop_admin_change_pin', { p_pin: PIN, p_new_pin: np });
        PIN = np; sessionStorage.setItem('af_admin_pin', PIN);
      }
      m.remove(); alert('اتحفظ ✓');
    } catch (e2) { err.textContent = e2.message; err.classList.remove('hidden'); }
  };
};

// دخول تلقائي لو الرمز محفوظ في الجلسة
if (PIN) load().then(showApp, () => { sessionStorage.removeItem('af_admin_pin'); PIN = ''; });
</script>
</body>
</html>
