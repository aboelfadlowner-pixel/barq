<script>
  // ES modules do not load from file:// — explain how to run it instead of showing a blank page.

    document.getElementById('view').innerHTML =
      '<div class="center-state"><div><h2>يلزم تشغيل خادم محلي</h2>' +
      '<p>من مجلد المشروع شغّل: <code dir="ltr">python3 -m http.server 8000</code><br>' +
      'ثم افتح: <code dir="ltr">http://localhost:8000/call-center/</code></p></div></div>';
  }
</script>
